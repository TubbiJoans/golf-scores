<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e3b2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golf Scores">
<meta name="description" content="Live leaderboard and scoring for Pairs 3-3-3 Stableford at Jebel Sifah">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Golf Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a clubhouse scoreboard — clear, outdoors-readable, no fuss
   IDEA: the paper scorecard and the leaderboard board by the 9th green
   PICTURE: the live leaderboard itself, big point totals
   COLOUR/TYPE: fairway green ground, white cards, flag red accent; Barlow Condensed numbers, Inter text
   LAYOUT: one column, sticky header + tabs, 44px+ targets for thumbs on the course */
:root{--g:#0e3b2c;--g2:#1f5c44;--g3:#e8f1ec;--ink:#13201a;--mut:#5b6b63;--line:#d9e2dc;--bg:#f4f7f5;--red:#e63946;--card:#fff;--gold:#f4b740;--up:#15803d;
--f0:#1f7a4d;--f1:#2b6cb0;--f2:#b7791f}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{transition:transform .08s ease,background-color .15s}
button:active{transform:scale(.96)}
.top{background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center}
.brand svg{flex:none}
h1{font:700 26px/1.05 "Barlow Condensed",system-ui,sans-serif;margin:0;letter-spacing:.2px}
.top p{margin:2px 0 0;font-size:13px;opacity:.8}
.net{font-size:12px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.net.live::before,.net.off::before,.net.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:6px;vertical-align:1px}
.net.live::before{animation:blink 2.4s ease-in-out infinite}
.net.off::before{background:#fbbf24}.net.sync::before{background:#93c5fd}
@keyframes blink{50%{opacity:.35}}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--g);padding:0 max(8px,env(safe-area-inset-left)) 8px}
.tabs button{border:0;background:none;color:#cfe3d8;padding:10px 4px;font-weight:600;font-size:15px;border-radius:10px;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button svg{width:17px;height:17px;flex:none}
.tabs button.on{background:#fff;color:var(--g)}
main{max-width:720px;margin:0 auto;padding:14px max(12px,env(safe-area-inset-left)) 40px}
main>section.show{animation:vin .22s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* "add to home screen" helper card (only in a browser tab, never in the installed app) */
#inst{background:var(--card);border-radius:14px;box-shadow:0 1px 0 var(--line),0 2px 10px rgba(14,59,44,.08);padding:14px;margin-bottom:12px;border:2px solid var(--gold)}
#inst .ih{display:flex;gap:12px;align-items:center;margin-bottom:8px}
#inst .ih img{width:44px;height:44px;border-radius:11px;flex:none}
#inst .ih b{display:block;font:700 20px/1.1 "Barlow Condensed",system-ui,sans-serif}
#inst .ih small{color:var(--mut);font-size:13px}
#inst ol{margin:6px 0 10px;padding-left:22px;font-size:15px;line-height:1.45}
#inst ol li{margin:2px 0}
#inst .row{display:flex;gap:8px;flex-wrap:wrap}
#inst .row .btn{flex:1 1 auto;min-height:46px;text-decoration:none;display:flex;align-items:center;justify-content:center}
#inst .lnk{display:block;margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--g3);font:600 14px/1.3 Inter,system-ui,sans-serif;word-break:break-all;user-select:all;-webkit-user-select:all}
#inst .skip{display:block;margin:10px auto 0;background:none;border:0;color:var(--mut);font:600 14px Inter,system-ui,sans-serif;text-decoration:underline;padding:8px;min-height:40px}
#inst .ic{display:inline-block;min-width:22px;padding:0 4px;border-radius:5px;background:var(--g3);text-align:center;font-weight:700}
.banner{background:#fff4d6;border:1px solid #f0d48a;color:#6b4e00;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
.empty .ill{font-size:46px;line-height:1;margin-bottom:10px}
.empty h2{font:700 28px "Barlow Condensed",system-ui,sans-serif;color:var(--ink);margin:0 0 6px}
/* ticker */
.tick{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 0 var(--line);overflow:hidden}
.tick summary{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;min-height:48px}
.tick summary::-webkit-details-marker{display:none}
.tick .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(230,57,70,.6);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(230,57,70,0)}100%{box-shadow:0 0 0 0 rgba(230,57,70,0)}}
.tick .tx{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick .tx.new{animation:slidein .45s ease-out}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.tick .age{flex:none;font-size:12px;color:var(--mut)}
.tick ul{list-style:none;margin:0;padding:0 14px 10px}
.tick li{font-size:14px;padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.tick li span{color:var(--mut);font-size:12px;white-space:nowrap}
.tick .b,.tick li.b{color:#9a3412}
.tick .tx.b::before,.tick li.b b::before{content:"🐦 "}
.tick .e,.tick li.e{color:#a16207}
.tick .tx.e::before,.tick li.e b::before{content:"🦅 "}
.tick .a,.tick li.a{color:#7c3aed}
.tick .tx.a::before,.tick li.a b::before{content:"⛳ "}
.tick .al,.tick li.al{color:#0369a1}
.tick .tx.al::before,.tick li.al b::before{content:"🕊️ "}
/* winner */
.win{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#0e3b2c,#1f5c44);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(14,59,44,.25)}
.win .tro{font-size:40px;line-height:1}
.win b{display:block;font:700 26px/1.05 "Barlow Condensed",system-ui,sans-serif}
.win small{opacity:.85;font-size:13px}
.win .btn{margin-left:auto;background:var(--gold);color:var(--g);flex:none}
/* leaderboard */
.lb{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lb li{background:var(--card);border-radius:14px;box-shadow:0 1px 0 var(--line),0 2px 10px rgba(14,59,44,.06);overflow:hidden;position:relative}
.lb li.hot{animation:glow 1.1s ease-in-out 4}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--gold),0 6px 22px rgba(244,183,64,.45)}}
.lb li.hot2{animation:glow2 .8s ease-in-out 10}
@keyframes glow2{0%,100%{box-shadow:0 0 0 2px var(--gold)}50%{box-shadow:0 0 0 5px var(--gold),0 0 34px 6px rgba(244,183,64,.75);transform:scale(1.02)}}
.lb li.hot3{animation:glow3 .9s linear 16;z-index:1}
.lb li.hot4{animation:glow4 1s ease-in-out 16;z-index:1}
@keyframes glow4{0%,100%{box-shadow:0 0 0 4px #0ea5e9,0 0 30px #0ea5e9}33%{box-shadow:0 0 0 4px #14b8a6,0 0 34px #22d3ee}66%{box-shadow:0 0 0 4px #f4b740,0 0 30px #38bdf8;transform:scale(1.02)}}
@keyframes glow3{0%{box-shadow:0 0 0 4px #ff3b3b,0 0 30px #ff3b3b}20%{box-shadow:0 0 0 4px #ffb000,0 0 30px #ffb000}40%{box-shadow:0 0 0 4px #22c55e,0 0 30px #22c55e}60%{box-shadow:0 0 0 4px #3b82f6,0 0 30px #3b82f6}80%{box-shadow:0 0 0 4px #a855f7,0 0 30px #a855f7}100%{box-shadow:0 0 0 4px #ff3b3b,0 0 30px #ff3b3b}}
.lb summary{list-style:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto 58px;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;min-height:64px}
.lb summary::-webkit-details-marker{display:none}
.pos{font:700 30px/1 "Barlow Condensed",system-ui,sans-serif;color:var(--g);text-align:center;position:relative}
.lb li:first-child .pos{color:#fff;background:var(--g);border-radius:10px;padding:6px 0}
.mv{display:block;font:700 11px/1 Inter;margin-top:3px}
.mv.up{color:var(--up)}.mv.dn{color:var(--red)}
.lb li:first-child .mv.up{color:#86efac}
.who b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--mut);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .bb{color:#9a3412;font-weight:700}
.who .bb.e2{background:linear-gradient(90deg,#a16207,#f4b740,#a16207);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.6s linear 6}
.who .bb.e3{background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e,#3b82f6,#a855f7,#ef4444);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.2s linear 10;font-weight:800}
.who .bb.e4{background:linear-gradient(90deg,#1e40af,#0ea5e9,#22d3ee,#f4b740,#1e40af);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.4s linear 8;font-weight:800}
@keyframes shine{to{background-position:-200% 0}}
.thru{font-size:13px;color:var(--mut);white-space:nowrap;text-align:right}
.thru b{display:block;color:var(--ink);font-weight:700}
.pts{font:700 36px/1 "Barlow Condensed",system-ui,sans-serif;text-align:right}
.pts small{display:block;font:500 11px Inter;color:var(--mut)}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 14px 12px}
.seg{border-radius:10px;padding:8px;background:var(--g3);text-align:center}
.seg span{display:block;font-size:12px;color:var(--mut)}
.seg b{display:block;font:700 22px/1.1 "Barlow Condensed",system-ui,sans-serif}
.seg i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
.proj{padding:0 14px 10px;font-size:13px;color:var(--mut)}
.scroll{overflow-x:auto}
table.sc{border-collapse:collapse;width:100%;font-size:14px;margin:0 0 12px}
.sc th,.sc td{padding:6px 4px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
.sc th:first-child,.sc td:first-child{text-align:left;padding-left:14px;color:var(--mut);font-weight:500}
.sc .tot{font-weight:700}
.sc td.bd span{display:inline-block;min-width:24px;height:24px;line-height:20px;border:2px solid var(--red);border-radius:50%;color:var(--red);font-weight:700}
.sc td.eg span{border-color:var(--gold);color:#a16207;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--gold)}
.sc td.alb span{background:linear-gradient(135deg,#22d3ee,#0ea5e9 50%,#1e40af);border-color:transparent;color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px #0ea5e9}
.sc td.ace span{background:linear-gradient(135deg,#f4b740,#ef4444 50%,#a855f7);border-color:transparent;color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px #a855f7}
.dot0{box-shadow:inset 0 -3px 0 var(--f0)}.dot1{box-shadow:inset 0 -3px 0 var(--f1)}.dot2{box-shadow:inset 0 -3px 0 var(--f2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:12px 2px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.more{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
/* scoring */
.panel{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 0 var(--line);margin-bottom:12px}
label{font-size:13px;color:var(--mut);font-weight:500}
select,input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:16px}
select.need{border:2px solid var(--red);animation:nudge 1.4s ease-in-out 2}
@keyframes nudge{50%{box-shadow:0 0 0 5px rgba(230,57,70,.18)}}
input.filled{background:#fff6c2;transition:background .3s}
input:focus,select:focus,button:focus-visible{outline:3px solid #9ad3b4;outline-offset:1px}
.btn{border:0;border-radius:12px;min-height:48px;padding:10px 16px;font-weight:700;background:var(--g);color:#fff;cursor:pointer}
.btn.ghost{background:var(--g3);color:var(--g)}
.btn.warn{background:#fde8ea;color:#a01826}
.btn.warn.armed,.btn.armed{background:var(--red);color:#fff}
.btn.gold{background:var(--gold);color:var(--g)}
.btn.wa{background:#25d366;color:#073b2a;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.shareok{display:block!important;background:#e9f7ef!important;border-color:#b7e2c8!important}
.shareok p{margin:0 0 8px;font-weight:600}
.dres .shareok .row{display:flex;background:none;border:0;padding:0;gap:8px;align-items:stretch}
.dres .shareok .row .btn.wa{flex:2 1 auto}.dres .shareok .row .btn{flex:1 1 auto}
.btn.wa{text-align:center}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 140px}
.hole{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 0 var(--line);border-left:6px solid var(--c);overflow:hidden;scroll-margin-top:70px}
.hh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 4px}
.hh b{font:700 24px "Barlow Condensed",system-ui,sans-serif}
.hh span{font-size:13px;color:var(--mut)}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto 48px;gap:8px;align-items:center;padding:8px 14px 12px}
.ent+.ent{border-top:1px dashed var(--line);padding-top:10px}
.ent .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .nm small{display:block;white-space:normal;font-weight:400;color:var(--mut);font-size:12px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:48px;border-radius:12px;border:0;background:var(--g3);color:var(--g);font-size:26px;font-weight:600;cursor:pointer;touch-action:manipulation}
.step button:active{transform:scale(.88);background:#cfe5d9}
.step output{width:40px;text-align:center;font:700 30px/1 "Barlow Condensed",system-ui,sans-serif}
.step output.bird{color:var(--red)}
.step output.eagle{color:#d18b00;text-shadow:0 0 10px rgba(244,183,64,.7)}
.step output.alb{background:linear-gradient(90deg,#1e40af,#0ea5e9,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent}
.step output.ace{background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e,#3b82f6,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.pop{animation:pop .32s ease-out}
@keyframes pop{40%{transform:scale(1.28)}}
.pt{text-align:center;border-radius:10px;padding:4px 0;background:var(--g3)}
.pt b{display:block;font:700 24px/1 "Barlow Condensed",system-ui,sans-serif}
.pt small{font-size:11px;color:var(--mut)}
.pt.none{opacity:.45}
.pt.hi{background:#fde8ea}
.segh{font:700 18px "Barlow Condensed",system-ui,sans-serif;letter-spacing:.3px;margin:18px 2px 8px;color:var(--c);display:flex;justify-content:space-between}
.segh span{font:500 13px Inter;color:var(--mut)}
.jump{display:block;width:100%;margin-top:10px}
/* setup */
.pair{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.pair .full{grid-column:1/-1;display:flex;gap:8px}
.pair .full input{flex:1}
.x{flex:none;width:46px;border:0;border-radius:10px;background:#fde8ea;color:#a01826;font-size:20px;cursor:pointer}
.course{border-collapse:collapse;width:100%}
.dlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:380px;overflow:auto;margin:8px 0;padding:2px}
.chk{display:flex;gap:8px;align-items:center;min-height:46px;padding:4px 10px;border-radius:10px;background:var(--g3);font-weight:600;cursor:pointer}
.chk small{font-weight:400;color:var(--mut);font-size:12px;display:block}
.chk input{width:22px;min-height:22px;height:22px;flex:none;accent-color:var(--g);margin:0}
.dres{margin-top:10px;display:grid;gap:6px}.dres div{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dres b{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:20px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 72px 46px;gap:6px;padding:5px 0}
details.panel>summary{list-style:none}details.panel>summary::before{content:"▸ ";color:var(--g)}details[open].panel>summary::before{content:"▾ "}
.course td,.course th{padding:3px;text-align:center;font-size:13px;color:var(--mut)}
.course input{min-width:44px;padding:6px 2px;text-align:center}
h2.sec{font:700 22px "Barlow Condensed",system-ui,sans-serif;margin:0 0 8px}
.note{font-size:13px;color:var(--mut);margin:6px 0 0}
.note.warn{color:#a01826}
/* results + history */
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rhead h2{font:700 30px/1 "Barlow Condensed",system-ui,sans-serif;margin:0}
.rhead small{display:block;color:var(--mut);font-size:13px}
.back{border:0;background:var(--g3);color:var(--g);border-radius:10px;min-height:44px;padding:0 12px;font-weight:700;cursor:pointer;flex:none}
.stand{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.stand li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:0 1px 0 var(--line)}
.stand .md{font-size:26px;text-align:center;font-weight:700;font-family:"Barlow Condensed",system-ui,sans-serif;color:var(--g)}
.stand li:first-child{background:linear-gradient(135deg,#fff8e6,#fff);box-shadow:0 0 0 2px var(--gold)}
.stand .sp{font-size:12px;color:var(--mut)}
.hls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.hlc{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 0 var(--line);border-top:4px solid var(--c,var(--g))}
.hlc span{display:block;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.hlc b{display:block;font:700 22px/1.1 "Barlow Condensed",system-ui,sans-serif;margin:4px 0 2px}
.hlc small{font-size:13px;color:var(--mut)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist li{display:flex;gap:8px;align-items:stretch}.hist li>button[data-arch]{flex:1;min-width:0}
.hist .del{flex:none;width:auto;min-width:56px;padding:0 10px;border:0;border-radius:14px;background:#fde8ea;color:#a01826;font:700 14px Inter,system-ui,sans-serif;cursor:pointer;box-shadow:0 1px 0 var(--line);justify-content:center;text-align:center}
.hist .del:not(.armed){font-size:20px}
.hist .del.armed{background:var(--red);color:#fff}
.hist button{width:100%;text-align:left;border:0;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 0 var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
.hist b{display:block}.hist small{color:var(--mut);font-size:13px}
.hist .w{font:700 22px "Barlow Condensed",system-ui,sans-serif;color:var(--g);white-space:nowrap}
#modal{position:fixed;inset:0;background:rgba(10,30,22,.72);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
#modal[hidden]{display:none}
#modal .box{background:#fff;border-radius:16px;padding:14px;max-width:420px;width:100%;max-height:90vh;overflow:auto;text-align:center}
#modal img{width:100%;border-radius:10px;display:block;margin-bottom:10px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:78}
/* eagle banner */

#eagle b{display:block;font:800 52px/1 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.02em;text-shadow:0 2px 0 #fff8}

@keyframes eagleout{to{opacity:0;transform:translate(-50%,-90%) scale(.8)}}
@keyframes flap{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-8px) rotate(8deg)}}
/* hole in one: the whole app goes wild */
#ace{position:fixed;inset:0;z-index:77;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;cursor:pointer;overflow:hidden;
  background:conic-gradient(from 0deg,#ef4444,#f59e0b,#eab308,#22c55e,#06b6d4,#3b82f6,#a855f7,#ec4899,#ef4444);animation:acebg 2.2s linear infinite,acein .35s ease-out}
#ace::before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(rgba(255,255,255,.22) 0 10deg,transparent 10deg 20deg);animation:spin 6s linear infinite}
#ace::after{content:"";position:absolute;inset:0;background:radial-gradient(circle,rgba(10,30,22,.15) 0,rgba(10,30,22,.65) 75%);animation:flash .5s ease-out}
#ace .in{position:relative;z-index:1;padding:20px}
#ace .ball{font-size:78px;line-height:1;display:block;animation:bounce .55s cubic-bezier(.3,0,.6,1) infinite alternate}

#ace small{display:block;opacity:.85;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.5)}
#ace.out{animation:aceout .5s ease-in forwards}
#ace.alb{background:conic-gradient(from 0deg,#1e40af,#0ea5e9,#22d3ee,#a5f3fc,#ffffff,#f4b740,#14b8a6,#0369a1,#1e40af);animation:spinbg 3s linear infinite,acein .35s ease-out}
#ace.alb.out{animation:aceout .5s ease-in forwards}
#ace.alb .ball{animation:glide 2.2s ease-in-out infinite;font-size:84px}

@keyframes acebg{to{filter:hue-rotate(360deg)}}

function fxAdd(ps){if(reduce)return;const dpr=Math.min(2,devicePixelRatio||1);
  if(!fxc){fxc=document.createElement('canvas');fxc.id='confetti';document.body.appendChild(fxc);fxc.width=innerWidth*dpr;fxc.height=innerHeight*dpr;requestAnimationFrame(fxFrame)}
  const t0=performance.now();for(const p of ps(fxc.width,fxc.height,dpr)){p.t0=t0;fxp.push(p)}}
function fxFrame(t){const x=fxc.getContext('2d'),W=fxc.width,H=fxc.height;x.clearRect(0,0,W,H);
  fxp=fxp.filter(p=>{const k=(t-p.t0)/1000;if(k>p.life||p.y>H+60)return false;p.vy+=p.g;p.vx*=p.dr;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;
    x.save();x.globalAlpha=Math.max(0,Math.min(1,1-k/p.life));x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;
    if(p.round){x.beginPath();x.arc(0,0,p.w/2,0,7);x.fill()}else x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore();return true});

function sparks({x,y,n,cols,pow,up=0,dx=0,round=false}){

    $('save').click();if(scored)toast('Pairs replaced. Clear the old scores below when you start the new round.',4500)}
  else if(t.id==='addpl'){$('players').insertAdjacentHTML('beforeend',playerRow({}));setupDirty=true}
  else if(t.matches('[data-prm]')){t.closest('.prow').remove();setupDirty=true}
  else if(t.id==='savep'){const list=[...document.querySelectorAll('.prow')].map(r=>({n:r.querySelector('[data-pn]').value.trim(),l:r.querySelector('[data-pl]').value.trim(),h:parseH(r.querySelector('[data-ph]').value)})).filter(p=>p.n);
    const seen=new Set(),dup=list.find(p=>{const k=pkey(p).toLowerCase();if(seen.has(k))return true;seen.add(k)});if(dup){toast(`${pkey(dup)} is on the list twice`);return}
    try{t.disabled=true;await savePlayers(list);P=list;setupDirty=false;toast('Players saved')}catch(err){toast('Not saved: '+(err.code||err.message))}finally{t.disabled=false}}
  else if(t.id==='save'){const pairs=[...document.querySelectorAll('.pair')].map(r=>{const o={id:r.dataset.id};
      r.querySelectorAll('[data-f]').forEach(i=>{const f=i.dataset.f,v=i.value.trim();if((f==='p3'||f==='h3')&&!r.querySelector('[data-f=p3]').value.trim())return;o[f]=f[0]==='h'?parseH(v):v});return o});
    const par=[...document.querySelectorAll('[data-par]')].map(i=>Math.min(7,Math.max(3,parseInt(i.value)||4))),si=[...document.querySelectorAll('[data-si]')].map(i=>parseInt(i.value)||0);
    if(new Set(si).size!==9||si.some(v=>v<1||v>18)){shareNext=false;toast('Each hole needs its own SI (1–18). Check the course card.');return}
    try{t.disabled=true;await saveRound({title:$('t-title').value.trim(),course:$('t-course').value.trim(),par,si,pairs});setupDirty=false;toast('Setup saved');
      if(shareNext){shareNext=false;sharedIds=pairs.map(p=>p.id).join();showDraft();const d=$('dres');if(d)d.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'})}}
    catch(err){shareNext=false;toast('Not saved: '+(err.code||err.message))}finally{t.disabled=false}}
  else if(t.id==='arch'){const un=unfinished();
    if(!R.pairs.length){toast('No round to archive yet');return}
    if(un.length){toast(`Archive unlocks when every team has a score on all 9 holes. Missing: ${un.slice(0,4).join(', ')}${un.length>4?` and ${un.length-4} more`:''}. ${ARCH_HELP}`,8000);return}
    if(!t.classList.contains('armed')){t.classList.add('armed');t.textContent='Tap again to archive';setTimeout(()=>{t.classList.remove('armed');t.textContent='🗂 Archive this round'},4000);return}
    t.classList.remove('armed');t.textContent='🗂 Archive this round';
    try{t.disabled=true;await archiveRound();toast('Round archived to Past rounds. Clear the scores when you are ready for the next one.',4000)}catch(err){toast('Not archived: '+(err.code||err.message)+(String(err.code).includes('permission')?' (Firestore rules need updating)':''),5000)}finally{t.disabled=false}}
  else if(t.id==='clear'){if(!t.classList.contains('armed')){t.classList.add('armed');t.textContent='Tap again to clear every score';setTimeout(()=>{t.classList.remove('armed');t.textContent='Clear all scores'},4000);return}
    t.classList.remove('armed');t.textContent='Clear all scores';
    if(LOCAL){S={};ls.set('gs-demo-S',S);feed=[];saveFeed();render();toast('Scores cleared');return}
    try{await Promise.all(Object.keys(S).map(id=>fs.deleteDoc(fs.doc(db,'scores',id))));feed=[];saveFeed();toast('Scores cleared')}catch(err){toast('Not cleared: '+(err.code||err.message))}}
  else if(t.id==='out'){if(LOCAL){user=null;render()}else{await au.signOut(auth)}}});
setInterval(()=>{if(view==='board'&&!document.hidden)renderBoard()},30000);

// ---------- start ----------
async function start(){
  if(LOCAL){
    $('banner').innerHTML=`<div class="banner"><b>Demo mode.</b> Not connected to Firebase yet. Anything entered stays on this phone only. Any PIN unlocks.</div>`;
    net('demo');R={...structuredClone(DEF),...ls.get('gs-demo-R',{})};S=ls.get('gs-demo-S',{});P=ls.get('gs-demo-P',P);render();ready=true;live=true;
    addEventListener('storage',e=>{if(e.key==='gs-demo-S')applyScores(ls.get('gs-demo-S',{}));else if(e.key==='gs-demo-R'){R={...structuredClone(DEF),...ls.get('gs-demo-R',{})};render('round')}else if(e.key==='gs-demo-P'){P=ls.get('gs-demo-P',P);render('roster')}});
    return}
  try{
    const [appM,fsM,auM]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-firestore.js'),import(SDK+'firebase-auth.js')]);
    fs=fsM;au=auM;const app=appM.initializeApp(firebaseConfig);
    try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch{db=fs.getFirestore(app)}
    auth=au.getAuth(app);
    au.onAuthStateChanged(auth,u=>{user=u;render()});
    const slow=setTimeout(()=>net('off'),10000);setTimeout(()=>{ready=true},8000);
    fs.onSnapshot(fs.doc(db,'rounds','roster'),s=>{const d=s.exists()&&s.data().players;if(Array.isArray(d)&&d.length){P=d;render('roster')}},()=>{});
    fs.onSnapshot(fs.doc(db,'rounds','current'),{includeMetadataChanges:true},s=>{
      if(s.exists())R={...structuredClone(DEF),...s.data()};
      if(!s.metadata.fromCache){clearTimeout(slow);net('live')}render('round')},e=>{net('off');toast('Cannot load round: '+e.code)});
    fs.onSnapshot(fs.collection(db,'scores'),{includeMetadataChanges:true},q=>{
      const n={};q.forEach(d=>{n[d.id]={...(d.data().s||{})}});
      for(const pid in pend)Object.assign(n[pid]??={},pend[pid]);
      applyScores(n);if(!q.metadata.fromCache){ready=true;live=true}
      net(q.metadata.fromCache?'off':q.metadata.hasPendingWrites?'sync':'live')},e=>toast('Cannot load scores: '+e.code));
    addEventListener('offline',()=>net('off'));
  }catch(err){net('off');$('banner').innerHTML=`<div class="banner">Could not connect. Check the internet and reopen the app.</div>`}
}
// ---------- "add to home screen" helper ----------
// A link tapped in WhatsApp opens in the phone's browser (or straight into the app if it is already installed).
// Many people don't know how to add a web app from there, so the leaderboard shows the shortest way for THIS browser:
// a one-tap Install (Chrome on Android), the right menu steps (Safari incl. the iOS 26 ⋯ layout, Chrome/Firefox on
// iPhone, Samsung Internet), or, inside another app's built-in viewer, a way out to the real browser + Copy link.
const UA=navigator.userAgent;
const isIOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=/Android/.test(UA);
const isSamsung=/SamsungBrowser/.test(UA);
const iosOther=isIOS&&/CriOS|FxiOS|EdgiOS|OPiOS/.test(UA);
const inApp=/WhatsApp|FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|; wv\)/.test(UA)||(isIOS&&!/Safari\//.test(UA));
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const appUrl=()=>location.origin+location.pathname;
const instOff=()=>isStandalone()||ls.get('gs-inst-done',0)||Date.now()-ls.get('gs-inst-later',0)<3*864e5;
let instEvt=null,instSteps=false;
// only take over Chrome's own install prompt when our card is going to offer it
addEventListener('beforeinstallprompt',e=>{if(!isAndroid||instOff())return;e.preventDefault();instEvt=e;renderInstall()});
addEventListener('appinstalled',()=>{instEvt=null;ls.set('gs-inst-done',1);renderInstall()});
function renderInstall(){
  const el=$('inst');if(!el)return;
  const hide=instOff()||view!=='board'||!(isIOS||isAndroid);       // desktop: nothing to do
  el.hidden=!!hide;if(hide)return;
  const u=appUrl(),host=location.host+location.pathname;
  const copy=`<button class="btn ghost" data-inst="copy">Copy link</button>`,later=`<button class="btn ghost" data-inst="later">Not now</button>`,
    skip=`<button class="skip" data-inst="later">${isIOS?'Already added, or just watching? Not now':'Not now, just watching'}</button>`;
  let sub='Then it opens like an app, straight to the scores.',body;
  if(inApp&&isAndroid){
    sub='This app’s built-in viewer can’t add it. Open it in Chrome first.';
    const intent=`intent://${host}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(u)};end`;
    body=`<div class="row"><a class="btn" href="${esc(intent)}" target="_blank" rel="noopener">Open in Chrome</a>${copy}</div>
      <p class="note" style="margin:8px 0 0">Nothing happened? Tap <span class="ic">⋮</span> and choose <b>Open in Chrome</b> (or <b>Open in browser</b>), or copy the link and paste it into Chrome.</p>${skip}`}
  else if(inApp&&isIOS){
    sub='This app’s built-in viewer can’t add it. Open it in Safari first.';
    body=`<div class="row"><a class="btn" href="x-safari-${esc(u)}">Open in Safari</a>${copy}</div>
      <p class="note" style="margin:8px 0 0">Nothing happened? Tap <span class="ic">⋯</span> or the compass icon and choose <b>Open in Safari</b>, or copy the link and paste it into Safari.</p>${skip}`}
  else if(iosOther){
    body=`<ol><li>Tap <b>Share</b> <span class="ic">⬆</span> in the address bar (or in the <span class="ic">⋯</span> menu).</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>${skip}`}
  else if(isIOS){
    body=`<ol><li>Tap <span class="ic">⋯</span> at the bottom, then <b>Share</b> <span class="ic">⬆</span><br><small style="color:var(--mut)">(older iPhones: just tap <b>Share</b> <span class="ic">⬆</span>)</small></li><li>Tap <b>Add to Home Screen</b> (scroll down if you don’t see it), then <b>Add</b>.</li></ol>
      <p class="note" style="margin:0">No “Add to Home Screen”? Tap the compass icon first to open this in Safari.</p>${skip}`}
  else if(isSamsung&&!instEvt){
    body=`<ol><li>Tap <span class="ic">≡</span> at the bottom right.</li><li>Tap <b>Add page to</b>, then <b>Home screen</b>.</li></ol>${skip}`}
  else{                                              // Chrome (or similar) on Android: one big button, same layout before and after the install event
    body=`<div class="row"><button class="btn" data-inst="install">Install app</button>${later}</div>${instSteps?`<ol style="margin:10px 0 0"><li>Tap <span class="ic">⋮</span> at the top right.</li><li>Tap <b>Add to Home screen</b> (or <b>Install app</b>), then <b>Install</b> / <b>Add</b>.</li></ol>
      <p class="note" style="margin:6px 0 0">No such option? Tap <span class="ic">⋮</span> → <b>Open in Chrome</b> first.</p>`:''}`}
  el.innerHTML=`<div class="ih"><img src="icon-192.png" alt=""><div><b>Add Golf Scores to your home screen</b><small>${sub}</small></div></div>${body}`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-inst]');if(!b)return;const k=b.dataset.inst;
  if(k==='install'){
    if(instEvt){const ev=instEvt;ev.prompt().catch(()=>{});const r=await ev.userChoice.catch(()=>null);instEvt=null;if(r&&r.outcome==='accepted')ls.set('gs-inst-done',1);else instSteps=true}
    else instSteps=true;                             // no install prompt from this browser: show the menu steps instead
    renderInstall()}
  else if(k==='later'){ls.set('gs-inst-later',Date.now());renderInstall()}
  else if(k==='copy'){let ok=false;try{await navigator.clipboard.writeText(appUrl());ok=true}catch{}
    if(ok)toast('Link copied. Open '+(isIOS?'Safari':'Chrome')+', tap the address bar and paste.',4200);
    else if(!$('inst').querySelector('.lnk')){$('inst').insertAdjacentHTML('beforeend',`<span class="lnk">${esc(appUrl())}</span>`);toast('Press and hold the link to copy it',3500)}}});
renderInstall();

// ---------- phone back button (Android) ----------
// History: [root] [Leaderboard step] [other screens…] [share-image pop-up]. Back closes what is in front (the share
// image or a celebration) first, then steps back through screens. In the installed Android app, back on the
// Leaderboard asks before leaving. If a step is added with no tap since the page loaded (or since the last back),
// Chrome lets the back button skip ALL the app's steps and close it, so steps are only added after a tap, and "staying put" steps forward onto the existing
// step instead of adding a new one.
const askBeforeExit=()=>isStandalone()&&isAndroid;
const delArm={};   // past-round id -> time its 🗑 was tapped once (kept across live re-renders)
const nav={depth:0,skip:0,ov:null,guard:false};
try{history.scrollRestoration='manual'}catch{}
function armGuard(){if(nav.guard||!askBeforeExit())return;nav.guard=true;history.pushState({gs:'v',v:'board',n:0},'')}
function navTo(v){armGuard();if(v==='board'){if(nav.depth>0){nav.skip++;history.go(-nav.depth);nav.depth=0}return}
  nav.depth++;history.pushState({gs:'v',v,n:nav.depth},'')}
function ovOpen(name,close){if(nav.ov){if(nav.ov.name===name)nav.ov.close=close;return}armGuard();nav.ov={name,close};history.pushState({gs:'ov',ov:name,n:nav.depth},'')}
function ovDone(name,fn){if(nav.ov&&nav.ov.name===name&&(!fn||nav.ov.close===fn)){nav.ov=null;nav.skip++;history.back()}}
{const s0=history.state;                                             // after a reload: go back to the first step we made
  if(s0&&(s0.gs==='v'||s0.gs==='ov')){const k=(s0.n||0)+(s0.gs==='ov'?1:0)+(s0.gs==='v'&&s0.v==='board'||askBeforeExit()&&(s0.n||0)>0?1:0);if(k>0&&history.length>k){nav.skip++;history.go(-k)}else history.replaceState({gs:'root',n:0},'')}
  else history.replaceState({gs:'root',n:0},'')}
addEventListener('pointerup',armGuard,{capture:true,passive:true});   // the first tap adds the "ask before exit" step
addEventListener('popstate',e=>{
  if(nav.skip>0){nav.skip--;return}                                   // our own history.back()/go()/forward(), not the user
  const ace=document.getElementById('ace');                           // a celebration in front: back just closes it
  if(ace&&!ace.classList.contains('out')){ace._close&&ace._close();nav.skip++;history.forward();return}
  if(nav.ov){const o=nav.ov;nav.ov=null;o.close();return}             // the share image: back closes it
  const st=e.state||{};
  if(st.gs==='root'){const was=nav.depth;nav.depth=0;if(nav.guard&&askBeforeExit())askExit();else if(!showView('board',true)){nav.depth=was;nav.skip++;history.forward()}return}
  if(st.gs==='v'){const was=nav.depth;nav.depth=st.n||0;if(st.v==='results')resSrc=null;   // back only ever lands on the live Results
    if(st.v!==view&&!showView(st.v,true)){nav.depth=was;nav.skip++;history.forward()}       // unsaved Setup: stay on it
    return}
  if(st.gs==='ov'){nav.skip++;history.back()}                         // a left-over pop-up step: skip it
});
function askExit(){const m=$('modal');m.dataset.kind='exit';
  m.innerHTML=`<div class="box" role="alertdialog" aria-label="Exit Golf Scores?"><h2 class="sec" style="margin:4px 0 6px">Exit Golf Scores?</h2>
    <p class="note" style="margin:0 0 12px">Press <b>back</b> again to close the app.<br>Scores keep updating when you open it again.</p>
    <button class="btn" data-exit="stay" type="button" style="width:100%">Stay</button></div>`;m.hidden=false}
function exitChoice(){const m=$('modal');m.hidden=true;m.dataset.kind='';nav.skip++;history.forward()}   // back onto the Leaderboard step
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();start();
}
