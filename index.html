<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e3b2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golf Scores">
<meta name="description" content="Live leaderboard and scoring for Friday golf at Jebel Sifah">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Golf Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a clubhouse scoreboard — clear, outdoors-readable, no fuss
   IDEA: the paper scorecard and the leaderboard board by the 9th green
   PICTURE: the live leaderboard itself, big point totals
   COLOUR/TYPE: fairway green ground, white cards, flag red accent; Barlow Condensed numbers, Inter text
   LAYOUT: one column, sticky header + tabs, 44px+ targets for thumbs on the course */
:root{--g:#0e3b2c;--g2:#1f5c44;--g3:#e8f1ec;--ink:#13201a;--mut:#5b6b63;--line:#d9e2dc;--bg:#f4f7f5;--red:#e63946;--card:#fff;--gold:#f4b740;--up:#15803d;
--f0:#1f7a4d;--f1:#2b6cb0;--f2:#b7791f}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{transition:transform .08s ease,background-color .15s}
button:active{transform:scale(.96)}
.top{background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center}
.brand svg{flex:none}
h1{font:700 26px/1.05 "Barlow Condensed",system-ui,sans-serif;margin:0;letter-spacing:.2px}
.top p{margin:2px 0 0;font-size:13px;opacity:.8}
.net{font-size:12px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.net.live::before,.net.off::before,.net.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:6px;vertical-align:1px}
.net.live::before{animation:blink 2.4s ease-in-out infinite}
.net.off::before{background:#fbbf24}.net.sync::before{background:#93c5fd}
@keyframes blink{50%{opacity:.35}}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 46px;gap:2px;background:var(--g);padding:0 max(8px,env(safe-area-inset-left)) 8px}
.tabs button{border:0;background:none;color:#cfe3d8;padding:10px 4px;font-weight:600;font-size:15px;border-radius:10px;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button svg{width:17px;height:17px;flex:none}
.tabs button.on{background:#fff;color:var(--g)}
.tabs button.gear{padding:10px 0}.tabs button.gear svg{width:21px;height:21px}
@media (max-width:520px){.tabs button:not(.gear){flex-direction:column;gap:2px;font-size:13px;line-height:1.15;padding:7px 2px;white-space:nowrap}}
/* today's format (tap for the rules), Players/Teams switch, match and skins cards */
.fban{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;border:0;background:var(--card);border-radius:14px;padding:9px 14px;margin-bottom:10px;box-shadow:0 1px 0 var(--line);min-height:52px;cursor:pointer;text-align:left}
.fban span{display:block;overflow:hidden}
.fban b{display:block;font:700 20px/1.15 "Barlow Condensed",system-ui,sans-serif}
.fban span small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fban>small{flex:none;color:var(--g);font-weight:600;font-size:13px}
.segc{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;background:#e3ece7;border-radius:12px;padding:4px;margin-bottom:10px}
.segc button{border:0;background:none;border-radius:9px;min-height:44px;font-weight:600;font-size:14px;color:var(--g);cursor:pointer}
.segc button.on{background:#fff;box-shadow:0 1px 3px rgba(14,59,44,.2)}
.prw{display:grid;grid-template-columns:44px minmax(0,1fr) auto minmax(58px,auto);gap:10px;align-items:center;padding:10px 14px;min-height:60px}
.mcard{background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:10px;box-shadow:0 1px 0 var(--line)}
.mcard>small{display:block;color:var(--mut);font-size:12px;margin-bottom:4px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.mrow>span{font-weight:600;font-size:14px}.mrow>span:last-child{text-align:right}.mrow>span.ld{color:var(--g);font-weight:800}
.mrow .mid{text-align:center;background:var(--g3);border-radius:10px;padding:6px 10px;font-weight:400}
.mrow .mid b{display:block;font:700 20px/1.1 "Barlow Condensed",system-ui,sans-serif;white-space:nowrap}
.mrow .mid i{display:block;font-style:normal;font-size:11px;color:var(--mut)}
.skb{display:block;font:700 18px "Barlow Condensed",system-ui,sans-serif;margin-bottom:8px}
.skstrip{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px}
.skstrip div{border-radius:8px;background:var(--g3);text-align:center;font:700 16px/1.2 "Barlow Condensed",system-ui,sans-serif;padding:5px 0}
.skstrip small{display:block;font:500 10px Inter,system-ui,sans-serif;color:var(--mut);overflow:hidden;white-space:nowrap}
.skstrip .won{background:var(--g);color:#fff}.skstrip .won small{color:#d6efe2}.skstrip .carry{background:#fff4d6}
h3.rsec{font:700 18px "Barlow Condensed",system-ui,sans-serif;margin:14px 2px 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px}
/* score entry: pick-up shortcut, what the hole did, Wolf / Bingo Bango Bongo choices */
.pu{display:block;border:0;background:none;color:var(--g);font:600 13px Inter,system-ui,sans-serif;text-decoration:underline;padding:8px 12px 8px 0;min-height:44px;margin:0 0 -10px;cursor:pointer}
.hsum{padding:0 14px 10px;font-size:13px;color:var(--mut)}.hsum b{color:var(--ink)}
.gx{padding:8px 14px 10px;border-top:1px dashed var(--line)}
.gx>b{display:block;font-size:14px;margin-bottom:6px}.gx>b small{font-weight:400;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-weight:600;font-size:14px;cursor:pointer}
.chips button.on{background:var(--g);color:#fff;border-color:var(--g)}
/* rules card */
#modal .box.rules{text-align:left;padding:16px}
.rules h2{font:700 26px/1.1 "Barlow Condensed",system-ui,sans-serif;margin:0 0 4px}
.rules h3{font:700 18px "Barlow Condensed",system-ui,sans-serif;margin:14px 0 4px;color:var(--g)}
.rules ul{margin:6px 0;padding-left:20px;font-size:14px;line-height:1.45}
.rules .al{background:var(--g3);border-radius:10px;padding:8px 10px;font-size:13px;display:grid;gap:3px}
.rules .hl{display:grid;gap:6px;font-size:13px}.rules .hl b{display:block}.rules .hl span{color:var(--mut)}
.bdg{display:inline-block;border-radius:99px;background:var(--g);color:#fff;font:700 10px/1.6 Inter,system-ui,sans-serif;padding:0 7px;vertical-align:1px;letter-spacing:.3px}
.bdg.cu{background:#fff;color:#6b4e00;box-shadow:inset 0 0 0 1px #f0d48a}
/* Setup: today's format and the roller */
#fmtp{scroll-margin-top:72px}
.fcur{display:flex;gap:12px;align-items:center}
.fcur .ic{font-size:30px;line-height:1;flex:none}
.fcur>div{flex:1;min-width:0}.fcur b{display:block;font:700 22px/1.1 "Barlow Condensed",system-ui,sans-serif}
.fcur small{display:block;color:var(--mut);font-size:13px}
.fcur .btn{flex:none;min-height:44px}
.fch{margin-top:10px;border-top:1px solid var(--line);padding-top:2px}
.fch>summary,.fpool>summary{cursor:pointer;font-weight:600;color:var(--g);min-height:46px;display:flex;align-items:center;list-style:none}
.fch>summary::-webkit-details-marker,.fpool>summary::-webkit-details-marker{display:none}
.fch>summary::after,.fpool>summary::after{content:"▾";margin-left:auto}
.fch[open]>summary::after,.fpool[open]>summary::after{content:"▴"}
.reels{display:grid;gap:8px;margin:4px 0 10px}.reels.mix{grid-template-columns:repeat(3,minmax(0,1fr))}
.reel small{display:block;text-align:center;font-size:12px;color:var(--mut);margin-bottom:4px}
.rwin{height:76px;overflow:hidden;border-radius:14px;background:linear-gradient(180deg,#0a2c21,#1f5c44 50%,#0a2c21);box-shadow:inset 0 0 0 2px var(--gold)}
.ri{height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:0 6px}
.ri i{font-style:normal;font-size:26px;line-height:1.15}.ri b{font:700 19px/1.1 "Barlow Condensed",system-ui,sans-serif}
.reels.mix .ri b{font-size:15px}
.ri.q{color:#cfe3d8}.ri.q i{font:700 28px/1.15 "Barlow Condensed",system-ui,sans-serif}
.reel.landed .rwin{animation:pop .32s ease-out}
.picks{display:grid;gap:6px;margin-bottom:10px}
.pick{display:flex;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 10px;min-height:52px;cursor:pointer}
.pick i{font-style:normal;font-size:22px;flex:none}.pick b{display:block;font-size:15px}.pick small{display:block;font-size:12px;color:var(--mut)}
.pick.on{border-color:var(--g);box-shadow:0 0 0 2px var(--g)}.pick:disabled{opacity:.5;cursor:default}
.fpool .chips button.off{opacity:.5;text-decoration:line-through}.fpool .chips button:disabled{opacity:.35}
/* Eclectic */
.ehead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin:2px 2px 12px}
.ehead h2{font:700 28px/1 "Barlow Condensed",system-ui,sans-serif;margin:0 0 3px}
.ehead small{color:var(--mut);font-size:13px;display:block}
.echip{flex:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:#e3ece7;color:var(--mut);white-space:nowrap}
.echip.on{background:var(--g);color:#fff}
.egrid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;margin:12px 0 4px}
.egrid label{display:block;text-align:center}
.egrid span{display:block;font:700 16px/1.1 "Barlow Condensed",system-ui,sans-serif;color:var(--ink)}
.egrid small{display:block;font-size:10px;color:var(--mut);margin-bottom:3px;white-space:nowrap}
.egrid input{width:100%;padding:8px 0;min-height:46px;text-align:center;font:700 20px "Barlow Condensed",system-ui,sans-serif;border-radius:8px}
.sc tr.erd td{color:var(--mut)}.sc tr.erd td.eb{color:var(--ink);font-weight:700}
.elink{display:inline-flex;align-items:center;border:0;background:none;color:var(--g);font:600 13px Inter,system-ui,sans-serif;text-decoration:underline;padding:6px 0;min-height:44px;cursor:pointer;white-space:nowrap}
.elb .thru b{font:700 20px/1 "Barlow Condensed",system-ui,sans-serif}
.elb .proj{margin:0}
.efoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px}
.ehls{margin-bottom:10px}.ehls .hlc b{overflow-wrap:anywhere;line-height:1.05}
main{max-width:720px;margin:0 auto;padding:14px max(12px,env(safe-area-inset-left)) 40px}
main>section.show{animation:vin .22s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* "add to home screen" helper card (only in a browser tab, never in the installed app) */
#inst{background:var(--card);border-radius:14px;box-shadow:0 1px 0 var(--line),0 2px 10px rgba(14,59,44,.08);padding:14px;margin-bottom:12px;border:2px solid var(--gold)}
#inst .ih{display:flex;gap:12px;align-items:center;margin-bottom:8px}
#inst .ih img{width:44px;height:44px;border-radius:11px;flex:none}
#inst .ih b{display:block;font:700 20px/1.1 "Barlow Condensed",system-ui,sans-serif}
#inst .ih small{color:var(--mut);font-size:13px}
#inst ol{margin:6px 0 10px;padding-left:22px;font-size:15px;line-height:1.45}
#inst ol li{margin:2px 0}
#inst .row{display:flex;gap:8px;flex-wrap:wrap}
#inst .row .btn{flex:1 1 auto;min-height:46px;text-decoration:none;display:flex;align-items:center;justify-content:center}
#inst .lnk{display:block;margin:8px 0 0;padding:8px 10px;border-radius:8px;background:var(--g3);font:600 14px/1.3 Inter,system-ui,sans-serif;word-break:break-all;user-select:all;-webkit-user-select:all}
#inst .skip{display:block;margin:10px auto 0;background:none;border:0;color:var(--mut);font:600 14px Inter,system-ui,sans-serif;text-decoration:underline;padding:8px;min-height:40px}
#inst .ic{display:inline-block;min-width:22px;padding:0 4px;border-radius:5px;background:var(--g3);text-align:center;font-weight:700}
.banner{background:#fff4d6;border:1px solid #f0d48a;color:#6b4e00;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
.empty .ill{font-size:46px;line-height:1;margin-bottom:10px}
.empty h2{font:700 28px "Barlow Condensed",system-ui,sans-serif;color:var(--ink);margin:0 0 6px}
/* ticker */
.tick{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 0 var(--line);overflow:hidden}
.tick summary{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;min-height:48px}
.tick summary::-webkit-details-marker{display:none}
.tick .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(230,57,70,.6);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(230,57,70,0)}100%{box-shadow:0 0 0 0 rgba(230,57,70,0)}}
.tick .tx{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick .tx.new{animation:slidein .45s ease-out}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.tick .age{flex:none;font-size:12px;color:var(--mut)}
.tick ul{list-style:none;margin:0;padding:0 14px 10px}
.tick li{font-size:14px;padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.tick li span{color:var(--mut);font-size:12px;white-space:nowrap}
.tick .b,.tick li.b{color:#9a3412}
.tick .tx.b::before,.tick li.b b::before{content:"🐦 "}
.tick .e,.tick li.e{color:#a16207}
.tick .tx.e::before,.tick li.e b::before{content:"🦅 "}
.tick .a,.tick li.a{color:#7c3aed}
.tick .tx.a::before,.tick li.a b::before{content:"⛳ "}
.tick .al,.tick li.al{color:#0369a1}
.tick .tx.al::before,.tick li.al b::before{content:"🕊️ "}
/* winner */
.win{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#0e3b2c,#1f5c44);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(14,59,44,.25)}
.win .tro{font-size:40px;line-height:1}
.win b{display:block;font:700 26px/1.05 "Barlow Condensed",system-ui,sans-serif}
.win small{opacity:.85;font-size:13px}
.win .btn{margin-left:auto;background:var(--gold);color:var(--g);flex:none}
/* leaderboard */
.lb{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lb li{background:var(--card);border-radius:14px;box-shadow:0 1px 0 var(--line),0 2px 10px rgba(14,59,44,.06);overflow:hidden;position:relative}
.lb li.hot{animation:glow 1.1s ease-in-out 4}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--gold),0 6px 22px rgba(244,183,64,.45)}}
.lb li.hot2{animation:glow2 .8s ease-in-out 10}
@keyframes glow2{0%,100%{box-shadow:0 0 0 2px var(--gold)}50%{box-shadow:0 0 0 5px var(--gold),0 0 34px 6px rgba(244,183,64,.75);transform:scale(1.02)}}
.lb li.hot3{animation:glow3 .9s linear 16;z-index:1}
.lb li.hot4{animation:glow4 1s ease-in-out 16;z-index:1}
@keyframes glow4{0%,100%{box-shadow:0 0 0 4px #0ea5e9,0 0 30px #0ea5e9}33%{box-shadow:0 0 0 4px #14b8a6,0 0 34px #22d3ee}66%{box-shadow:0 0 0 4px #f4b740,0 0 30px #38bdf8;transform:scale(1.02)}}
@keyframes glow3{0%{box-shadow:0 0 0 4px #ff3b3b,0 0 30px #ff3b3b}20%{box-shadow:0 0 0 4px #ffb000,0 0 30px #ffb000}40%{box-shadow:0 0 0 4px #22c55e,0 0 30px #22c55e}60%{box-shadow:0 0 0 4px #3b82f6,0 0 30px #3b82f6}80%{box-shadow:0 0 0 4px #a855f7,0 0 30px #a855f7}100%{box-shadow:0 0 0 4px #ff3b3b,0 0 30px #ff3b3b}}
.lb summary{list-style:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto minmax(58px,auto);gap:10px;align-items:center;padding:12px 14px;cursor:pointer;min-height:64px}
.lb summary::-webkit-details-marker{display:none}
.pos{font:700 30px/1 "Barlow Condensed",system-ui,sans-serif;color:var(--g);text-align:center;position:relative}
.lb li:first-child .pos{color:#fff;background:var(--g);border-radius:10px;padding:6px 0}
.mv{display:block;font:700 11px/1 Inter;margin-top:3px}
.mv.up{color:var(--up)}.mv.dn{color:var(--red)}
.lb li:first-child .mv.up{color:#86efac}
.who b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--mut);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .bb{color:#9a3412;font-weight:700}
.who .bb.e2{background:linear-gradient(90deg,#a16207,#f4b740,#a16207);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.6s linear 6}
.who .bb.e3{background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e,#3b82f6,#a855f7,#ef4444);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.2s linear 10;font-weight:800}
.who .bb.e4{background:linear-gradient(90deg,#1e40af,#0ea5e9,#22d3ee,#f4b740,#1e40af);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 1.4s linear 8;font-weight:800}
@keyframes shine{to{background-position:-200% 0}}
.thru{font-size:13px;color:var(--mut);white-space:nowrap;text-align:right}
.thru b{display:block;color:var(--ink);font-weight:700}
.pts{font:700 36px/1 "Barlow Condensed",system-ui,sans-serif;text-align:right}
.pts small{display:block;font:500 11px Inter;color:var(--mut)}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 14px 12px}
.seg{border-radius:10px;padding:8px;background:var(--g3);text-align:center}
.seg span{display:block;font-size:12px;color:var(--mut)}
.seg b{display:block;font:700 22px/1.1 "Barlow Condensed",system-ui,sans-serif}
.seg i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
.proj{padding:0 14px 10px;font-size:13px;color:var(--mut)}
.scroll{overflow-x:auto}
table.sc{border-collapse:collapse;width:100%;font-size:14px;margin:0 0 12px}
.sc th,.sc td{padding:6px 4px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
.sc th:first-child,.sc td:first-child{text-align:left;padding-left:14px;color:var(--mut);font-weight:500}
.sc .tot{font-weight:700}
.sc td.bd span{display:inline-block;min-width:24px;height:24px;line-height:20px;border:2px solid var(--red);border-radius:50%;color:var(--red);font-weight:700}
.sc td.eg span{border-color:var(--gold);color:#a16207;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--gold)}
.sc td.alb span{background:linear-gradient(135deg,#22d3ee,#0ea5e9 50%,#1e40af);border-color:transparent;color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px #0ea5e9}
.sc td.ace span{background:linear-gradient(135deg,#f4b740,#ef4444 50%,#a855f7);border-color:transparent;color:#fff;box-shadow:0 0 0 2px #fff,0 0 0 4px #a855f7}
.dot0{box-shadow:inset 0 -3px 0 var(--f0)}.dot1{box-shadow:inset 0 -3px 0 var(--f1)}.dot2{box-shadow:inset 0 -3px 0 var(--f2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:12px 2px 0}

#modal{position:fixed;inset:0;background:rgba(10,30,22,.72);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}

[hidden]{display:none!important}

#modal img{width:100%;border-radius:10px;display:block;margin-bottom:10px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:78}
/* hole in one (cartoon): a little green with a cup pops up on the score, the ball flies in with a sparkly trail, bounces, rolls
   round the rim and drops; the cup gulps, the flag jumps and twirls, fireworks, "HOLE IN ONE!", and the birdie, eagle and albatross
   loop the loop across the top. Albatross: the birdie, the eagle and the albatross each scare the one before (see albatross()). */
.holefx{position:fixed;left:0;top:0;z-index:73;width:140px;height:140px;pointer-events:none}
.holefx svg{display:block;width:100%;height:100%;overflow:visible;transform-origin:50% 67%;animation:holein .45s cubic-bezier(.2,1.5,.4,1) both}
@keyframes holein{from{transform:scale(0)}}
.holefx.gulp svg{animation:gulp .55s cubic-bezier(.3,1.6,.5,1)}
@keyframes gulp{30%{transform:scale(1.2,.75)}60%{transform:scale(.92,1.1)}}
.holefx .flag{transform-box:view-box;transform-origin:70px 92px}
.holefx.gulp .flag{animation:flagjump 1s cubic-bezier(.3,.9,.4,1) .08s both}   /* the flag jumps out of the cup, twirls and drops back in */
@keyframes flagjump{0%{transform:none}28%{transform:translateY(-40px)}42%{transform:translateY(-46px) scaleX(-1)}56%{transform:translateY(-40px) scaleX(1)}72%{transform:translateY(-22px) scaleX(-1)}88%{transform:translateY(-4px) scaleX(1)}100%{transform:none}}
.holefx .fl{transform-box:fill-box;transform-origin:left center;animation:wave .45s ease-in-out infinite alternate}
@keyframes wave{to{transform:skewY(9deg) scaleX(.88)}}
.holefx.out{transition:opacity .5s,transform .5s;opacity:0;transform:scale(.5)}
.ballfx{position:fixed;left:0;top:0;z-index:75;width:14px;height:14px;border-radius:50%;pointer-events:none;will-change:transform;
  background:radial-gradient(circle at 35% 30%,#fff 0,#fff 38%,#e3e7ea 62%,#aab3ba 100%);box-shadow:0 2px 5px rgba(0,0,0,.35)}
.acefx{position:fixed;left:0;top:0;z-index:76;width:min(92vw,420px);text-align:center;pointer-events:none;transform:translate(-50%,-50%)}
.acefx h2{margin:0;font:900 clamp(50px,15vw,80px)/.86 "Barlow Condensed",system-ui,sans-serif;letter-spacing:.01em;text-transform:uppercase;
  background:linear-gradient(180deg,#fff7d6,#ffd86b 45%,#e0a100);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #0e3b2c) drop-shadow(0 0 16px rgba(255,255,255,.85));animation:acetext .8s cubic-bezier(.2,1.8,.4,1) both,wobble 1.1s ease-in-out .8s 3}
.acefx p{display:inline-block;margin:10px 0 0;padding:6px 14px;border-radius:99px;background:var(--g);color:#fff;font:600 14.5px/1.25 Inter,system-ui,sans-serif;box-shadow:0 6px 16px rgba(0,0,0,.25);animation:capin .4s .35s both}
.acefx p b{font-weight:800}
.acefx.out{transition:opacity .45s,transform .45s;opacity:0;transform:translate(-50%,-62%) scale(.9)}
.whocard{position:fixed;left:50%;top:0;z-index:77;transform:translateX(-50%);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;width:max-content;max-width:92vw;
  padding:10px 12px;border-radius:16px;background:#fff;box-shadow:0 10px 28px rgba(8,30,22,.3);font:700 14px Inter,system-ui,sans-serif;color:var(--g);pointer-events:auto;animation:cardin .35s both}
.whocard span{flex-basis:100%;text-align:center}
.whocard button{min-height:44px;padding:0 18px;border:0;border-radius:99px;background:var(--g);color:#fff;font:700 16px Inter,system-ui,sans-serif;cursor:pointer}
@keyframes cardin{from{opacity:0;transform:translate(-50%,10px)}}
@keyframes capin{from{opacity:0;transform:translateY(10px)}}
@keyframes acetext{from{opacity:0;transform:scale(3) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes wobble{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(3deg) scale(1.08)}}
.albfx{position:fixed;left:0;top:0;z-index:76;width:230px;height:146px;pointer-events:none;will-change:transform}
.albfx svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 10px 12px rgba(0,0,0,.2))}
.albfx .aw{transform-box:fill-box;transform-origin:95% 95%;animation:awing .7s ease-in-out infinite alternate}
@keyframes awing{from{transform:rotate(4deg)}to{transform:rotate(-8deg)}}
.albfx .prey{opacity:0}
.albfx.got .prey{opacity:1}
.albfx .prey .w{transform-box:fill-box;transform-origin:90% 90%;animation:wing .09s ease-in-out infinite alternate}
.dimfx{position:fixed;inset:0;z-index:72;pointer-events:none;background:linear-gradient(180deg,rgba(6,22,16,.34),rgba(6,22,16,.1));opacity:0;transition:opacity .5s}
.dimfx.on{opacity:1}
.exbub{position:absolute;right:-8px;top:-18px;z-index:1;width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid #e63946;color:#e63946;font:900 18px/22px Inter,system-ui,sans-serif;text-align:center;pointer-events:none;animation:expop .3s cubic-bezier(.2,1.8,.4,1)}
.plop{position:fixed;left:0;top:0;z-index:74;line-height:1;pointer-events:none}
.lwrap{position:absolute;left:-44px;top:-34px;transform:scaleX(-1);pointer-events:none}   /* undoes the birdie's mirror so the words read right */

<script>
/* Golf Scores scoring engine (FG.Engine). Pure functions only: no screen, no storage. It knows every format: the handicap
   allowances, who gets a stroke where, and how a hole and a round are scored. The app below turns its pairs and scores into
   the engine's teams (see calc()) and draws what comes back. */
(function () {
'use strict';
const FG = window.FG = window.FG || {};

const HOLES = [1, 2, 3, 4, 5, 6, 7, 8, 9];
const SLOTS = ['a', 'b', 'c', 'd', 'e'];
const THIRDS = [[1, 2, 3], [4, 5, 6], [7, 8, 9]];
const DEF_PAR = [4, 4, 5, 4, 5, 3, 4, 3, 4];
const DEF_SI = [13, 1, 5, 15, 9, 11, 3, 17, 7];
const WHS = 'WHS', CUS = 'Custom', HSE = 'House', NONE = 'None';

// ---------- small maths ----------
// Round half away from zero (so +2.5 -> 3 and -2.5 -> -3). The 1e6 step removes binary noise like 6.499999.
const rnd = x => { const a = Math.round(Math.abs(x) * 1e6) / 1e6; return (x < 0 ? -1 : 1) * Math.round(a) || 0; };
const num = x => (x === undefined || x === null || x === '') ? null : +x;
const sum = a => a.reduce((s, x) => s + x, 0);

// Rank of each hole among the nine by stroke index: 1 = hardest.
function ranks(si) {
  const o = si.map((v, i) => [+v || 99, i]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
  const r = []; o.forEach((e, k) => { r[e[1]] = k + 1; }); return r;
}
// Strokes received on a hole of the given rank. A plus handicap gives strokes back on the easiest holes.
function strokes(ph, rank) {
  const m = Math.abs(ph), base = Math.floor(m / 9), extra = m % 9;
  return ph >= 0 ? base + (rank <= extra ? 1 : 0) : -(base + (rank > 9 - extra ? 1 : 0));
}
// Stableford. gross 0 = pick-up = 0 points; null = not played.
const stab = (par, g, st) => g == null ? null : g === 0 ? 0 : Math.max(0, par + 2 - (g - st));
// Modified Stableford: albatross 8, eagle 5, birdie 2, par 0, bogey -1, double bogey or worse (or a pick-up) -3.
function mstab(par, g, st) {
  if (g == null) return null; if (g === 0) return -3;
  const d = (g - st) - par; return d <= -3 ? 8 : d === -2 ? 5 : d === -1 ? 2 : d === 0 ? 0 : d === 1 ? -1 : -3;
}
// Celebration level from the gross score: 1 birdie, 2 eagle, 3 hole in one, 4 albatross.
function level(g, par) {
  if (g == null || g <= 0) return 0; if (g === 1) return 3;
  const d = par - g; return d >= 3 ? 4 : d === 2 ? 2 : d === 1 ? 1 : 0;
}
const LEVELS = ['', 'Birdie', 'Eagle', 'Hole in one', 'Albatross'];

// + and − on the score: an empty hole starts at par either way; below 1 is a pick-up (0), which is the floor.
function step(cur, par, dir) {
  if (cur == null) return par;
  return dir > 0 ? Math.min(15, cur + 1) : Math.max(0, cur - 1);
}
// Handicaps are typed as 18-hole numbers; "+2" (a plus handicap) is stored as -2.
function parseH(s) {
  s = String(s == null ? '' : s).trim().replace(',', '.').replace(/[−–]/g, '-'); if (!s) return null;
  const plus = s[0] === '+', n = parseFloat(s.replace(/^\+/, '')); if (isNaN(n)) return null;
  return plus ? -Math.abs(n) : n;
}
const fmtH = h => (h === '' || h == null) ? '' : (+h < 0 ? '+' + (-h) : String(+h));

// ---------- the formats ----------
const F = {
  stab: { name: 'Individual Stableford', short: 'Stableford', icon: '🎯', hue: 205, entry: 'ind', kind: 'pts', count: 'all', rank: 'player', mix: true, sizes: [2, 3],

  stroke: { name: 'Stroke Play', short: 'Stroke Play', icon: '🏌️', hue: 225, entry: 'ind', kind: 'stroke', count: 'all', rank: 'player', mix: false, sizes: [2, 3],
    how: 'Play your own ball and count every shot. The lowest net score wins.',

    allow: { 2: ['95% each player', WHS], 3: ['95% each player', WHS] } },

    allow: { 2: ['85% each player', WHS], 3: ['80% each player', CUS] } },
  shamble: { name: 'Shamble', short: 'Shamble', icon: '🚀', hue: 28, entry: 'ind', kind: 'pts', count: 'all', rank: 'team', mix: true, sizes: [2, 3],
    how: 'Everyone tees off, pick the best drive, then each plays their own ball in from there. Every score counts.',
    rules: ['All players tee off and the team chooses the best drive.', 'Everyone plays their own ball from that spot until it is holed.', 'Every player’s Stableford points count for the team.'],
    allow: { 2: ['75% each player', HSE], 3: ['75% each player', HSE] } },
  greensomes: { name: 'Greensomes', short: 'Greensomes', icon: '🤝', hue: 100, entry: 'ball', ball: 'Greensomes ball', kind: 'pts', count: 'ball', rank: 'team', mix: true, sizes: [2, 3],
    how: 'Everyone tees off, choose the best drive, then take alternate shots with that ball.',
    rules: ['All players tee off and the team picks one drive.', 'A player whose drive was not chosen plays the second shot, then shots alternate.', 'One score per hole, scored as Stableford.'],
    allow: { 2: ['60% low + 40% high', WHS], 3: ['50% low + 30% middle + 20% high', CUS] } },
  foursomes: { name: 'Foursomes', short: 'Foursomes', icon: '🔁', hue: 262, entry: 'ball', ball: 'Foursomes ball', kind: 'pts', count: 'ball', rank: 'team', mix: true, sizes: [2, 3],

  chapman: { name: 'Pinehurst / Chapman', short: 'Chapman', icon: '🔀', hue: 320, entry: 'ball', ball: 'Chapman ball', kind: 'pts', count: 'ball', rank: 'team', mix: true, sizes: [2, 3],
    how: 'Everyone tees off, swap balls for the second shot, then pick one ball and alternate.',

    rules: ['All players tee off. Your playing partners choose your drive (expect the worst one).', 'The player who hit that drive plays the second shot too, then shots alternate.', 'Out on your own with no other team? Play your worst drive.', 'One score per hole, scored as Stableford.'],
    allow: { 2: ['60% low + 40% high', CUS], 3: ['50% low + 30% middle + 20% high', CUS] } },
  mstab: { name: 'Modified Stableford', short: 'Mod. Stableford', icon: '🔥', hue: 12, entry: 'ind', kind: 'mstab', count: 'all', rank: 'player', mix: false, sizes: [2, 3],
    how: 'Go for it: big points for birdies and eagles, minus points for bogeys.',
    rules: ['Everyone plays their own ball.', 'Net albatross 8, eagle 5, birdie 2, par 0, bogey −1, double bogey or worse −3.', 'A pick-up scores −3.', 'The team total adds the players’ points together.'],
    allow: { 2: ['95% each player', WHS], 3: ['95% each player', WHS] } },
  parbogey: { name: 'Par / Bogey', short: 'Par / Bogey', icon: '⚖️', hue: 45, entry: 'ind', kind: 'par', rank: 'team', mix: false, sizes: [2, 3],
    how: 'Match play against the course. The team’s best net score wins, halves or loses each hole against par.',
    rules: ['Everyone plays their own ball; the team’s best net score counts.', 'Better than par wins the hole, par halves it, worse loses it.', 'The team that finishes most holes “up” on the course wins.'],
    allow: { 2: ['90% each player', WHS], 3: ['80% each player', CUS] } },
  mp1: { name: 'Singles Match Play', short: 'Singles', icon: '⚔️', hue: 0, entry: 'ind', kind: 'match', rank: 'team', mix: false, sizes: [2], need: 'evenPairs',
    how: 'The two teams in each group go head to head: player 1 v player 1 and player 2 v player 2.',
    rules: ['Each player plays a match against one opponent from the other team in the group.', 'Lowest net score wins the hole. A match ends when one side is more holes up than there are left.', 'A match won is 1 point for the team, a halved match ½.'],
    allow: { 2: ['100% of the difference between the two opponents', WHS] } },
  mp4: { name: 'Four-ball Match Play', short: 'Four-ball', icon: '🥊', hue: 232, entry: 'ind', kind: 'match', rank: 'team', mix: false, sizes: [2], need: 'evenPairs',
    how: 'The two teams in each group play a match. Each side’s better ball counts on every hole.',

    allow: { 2: ['90%, with strokes taken off the lowest player in the group', WHS] } },
  mpf: { name: 'Foursomes Match Play', short: 'Foursomes match', icon: '🪢', hue: 285, entry: 'ball', ball: 'Foursomes ball', kind: 'match', rank: 'team', mix: false, sizes: [2], need: 'evenPairs',
    how: 'The two teams in each group play a match with one ball each, alternate shots.',
    rules: ['Each side plays one ball, taking alternate shots.', 'The side with the lowest net score wins the hole.', 'The match ends when one side is more holes up than there are left.'],
    allow: { 2: ['50% of the difference between the sides’ combined handicaps', WHS] } },
  skins: { name: 'Skins', short: 'Skins', icon: '💰', hue: 135, entry: 'ind', kind: 'skins', rank: 'team', mix: false, sizes: [2, 3, 4, 5], need: 'multi',
    how: 'Every hole is worth a skin. Win the hole outright against the whole field to take it; ties carry over.',
    rules: ['Everyone plays their own ball; the team’s best net score counts.', 'The team with the best score on a hole, on its own, wins the skin.', 'If the best score is tied, the skin carries over to the next hole.', 'A hole is settled once every team has scored it.'],
    allow: { 2: ['90% each player', CUS], 3: ['80% each player', CUS], 4: ['75% each player', CUS], 5: ['70% each player', CUS] } },
  wolf: { name: 'Wolf', short: 'Wolf', icon: '🐺', hue: 215, entry: 'ind', kind: 'wolf', rank: 'player', mix: false, sizes: [2, 3, 4], need: 'groups34',
    how: 'A different player is the Wolf on each hole and picks a partner for the hole, or goes it alone.',

    allow: { 2: ['100% each player', CUS], 3: ['100% each player', CUS], 4: ['100% each player', CUS] } },

  // ---- teams of four (the draw makes teams of four for these; a field that doesn't split into fours leaves a team or two of three)
  scr4: { name: '4-Person Scramble', short: '4-Scramble', icon: '🧷', hue: 195, entry: 'ball', ball: 'Team ball', kind: 'pts', count: 'ball', rank: 'team', mix: true, sizes: [2, 3, 4, 5], need: 'fours',

  sh4: { name: '4-Person Shamble', short: '4-Shamble', icon: '🛫', hue: 40, entry: 'ind', kind: 'pts', count: 'best2', rank: 'team', mix: true, sizes: [2, 3, 4, 5], need: 'fours',

    how: 'Teams of four. Everyone plays their own ball, and the best Stableford score in the team counts on each hole.',

    allow: { 4: ['75% each player', WHS], 5: ['70% each player', CUS], 3: ['75% each player', CUS], 2: ['85% each player', WHS] } },

    how: 'Teams of four. Everyone plays their own ball, and the best two Stableford scores in the team count on each hole.',
    rules: ['Everyone plays their own ball.', 'On each hole the team’s best two Stableford scores count.'],
    allow: { 4: ['85% each player', WHS], 5: ['80% each player', CUS], 3: ['85% each player', CUS], 2: ['95% each player', CUS] } }
};
Object.keys(F).forEach(id => { F[id].id = id; });
const ALL = ['house', 'stab', 'stroke', 'bb', 'shamble', 'greensomes', 'foursomes', 'chapman', 'scramble', 'gruesomes', 'mstab', 'parbogey', 'mp1', 'mp4', 'mpf', 'skins', 'wolf', 'bbb', 'scr4', 'sh4', 'b1of4', 'b2of4'];
const MIXABLE = ALL.filter(id => F[id] && F[id].mix);
const HOUSE = { id: 'house', name: 'Pairs 3-3-3', short: 'Pairs 3-3-3', icon: '🏠', hue: 160, parts: ['shamble', 'greensomes', 'scramble'],
  how: 'Our house format: holes 1-3 Shamble, holes 4-6 Greensomes, holes 7-9 Scramble. Stableford all the way.',
  rules: ['Holes 1-3: Shamble. Best drive, then everyone plays their own ball. Every score counts.', 'Holes 4-6: Greensomes. Best drive, then alternate shots.', 'Holes 7-9: Scramble. Everyone plays from the best ball every time.'] };
const info = id => id === 'house' ? HOUSE : F[id];

// A locked format: one segment for a whole-round format, three for a 3-3-3.
function mkFormat(sel, mode) {
  if (Array.isArray(sel)) return { mode: mode || 'mix', key: 'mix:' + sel.join('+'), name: 'Mix 3-3-3', segs: sel.map((f, i) => ({ f, holes: THIRDS[i].slice() })) };
  if (sel === 'house') return { mode: mode || 'single', key: 'house', name: HOUSE.name, segs: HOUSE.parts.map((f, i) => ({ f, holes: THIRDS[i].slice() })) };
  return { mode: mode || 'single', key: sel, name: F[sel].name, segs: [{ f: sel, holes: HOLES.slice() }] };
}
const partsOfKey = key => !key ? [] : key === 'house' ? HOUSE.parts.slice() : key.indexOf('mix:') === 0 ? key.slice(4).split('+') : [key];

// ---------- teams, groups, handicaps ----------

// ---------- Eclectic: the winter-long competition ----------
// A season runs from 1 November to 28 February. Each player hands in between 4 and 8 nine-hole cards (4 is the minimum to count in the
// final standings; they can stop at any number from there up to 8), and their eclectic score is the best they made on each hole across
// those cards. Net = that total minus 25% of their (18-hole) handicap; lowest net leads. Organisers type the cards in, everyone can look.
// One document per season, rounds/eclectic-<year it starts>:
//   {kind:'eclectic',year,par:[9],cards:{<player id>:{n,l,h,r:{<card id>:{d:'2026-11-06',s:[9 scores, 0 = no score on that hole]}}}}}
// Every card has its own id, so saving or deleting one is a merge that touches nothing else: two organisers, or a phone that was
// offline or had not loaded the season yet, cannot wipe each other's cards.
const ECL_MAX=8,ECL_MIN=4,ECL_PCT=.25;
const eclYear=(d=new Date())=>d.getMonth()>=10?d.getFullYear():d.getFullYear()-1;   // Nov and Dec: this year's season; Jan to Oct: the one that began last November
const eclSeason=y=>({from:`${y}-11-01`,to:`${y+1}-02-28`,name:`${y}/${String(y+1).slice(2)}`});
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const eclId=p=>fold(pkey(p)).replace(/\s+/g,'-');
const fmtN=x=>String(+(+x).toFixed(2));
const dShort=d=>{const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(d||'');return m?new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString(undefined,{day:'numeric',month:'short'}):String(d||'')};
let ECcur={},EC=ECcur,eclLiveY=eclYear(),eclY=eclLiveY,eclOn=false,eclUnsub=null,eclPastUnsub=null,eform=null,edelArm=0;
const eclPar=()=>((Array.isArray(EC.par)&&EC.par.length===9?EC.par:null)||R.par||DEF.par).map(v=>+v||4);
const eclCards=c=>Object.entries((c&&c.r)||{}).map(([rid,r])=>({...(r||{}),rid})).filter(r=>Array.isArray(r.s)).sort((a,b)=>String(a.d).localeCompare(String(b.d))||a.rid.localeCompare(b.rid));   // oldest first
// follow the current season live; if the app is still open when 1 November comes, let go of the old season and follow the new one
function eclFollow(){const y=eclYear();if(eclOn&&y===eclLiveY)return;
  if(!LOCAL&&!db)return;const was=eclLiveY;eclLiveY=y;eclOn=true;if(eclY===was){eclY=y;eform=null}
  if(LOCAL){ECcur=ls.get('gs-demo-E-'+y,{});if(eclY===y)EC=ECcur;return}
  if(eclUnsub)eclUnsub();ECcur={};if(eclY===y)EC=ECcur;
  eclUnsub=fs.onSnapshot(fs.doc(db,'rounds','eclectic-'+y),s=>{if(y!==eclLiveY)return;ECcur=s.exists()?s.data():{};if(eclY===y){EC=ECcur;if(view==='ecl')renderEcl()}},()=>{})}
// everyone with a card, best first: fewest holes still without a score, then lowest net, then lowest gross. While the season is on,
// everyone is ranked (a player short of the minimum is told how many more they need); once it is over, only those with the minimum count.
// by: 'net' or 'gross'. Level players are split on countback over their best-hole card: holes 7-9, then 4-9, then the 9th. On the net
// table each step takes off the matching share of the 25% allowance (a third, two thirds, a ninth). Level after all three: a shared place.
function eclRows(by='net'){const par=eclPar(),out=[],over=today()>eclSeason(eclY).to,net=by!=='gross';
  for(const [id,c] of Object.entries(EC.cards||{})){const rs=eclCards(c);if(!rs.length)continue;
    const now=P.find(p=>eclId(p)===id),h=now&&(!over||c.h==null)?+now.h||0:+c.h||0;   // their handicap today; once the season is over, as it was when their last card went in
    const best=par.map((_,i)=>{let v=null,from=-1;rs.forEach((r,j)=>{const x=+r.s[i]||0;if(x>0&&(v===null||x<v)){v=x;from=j}});return{v,from}});
    const miss=best.filter(b=>b.v===null).length,gross=best.reduce((a,b)=>a+(b.v||0),0);
    out.push({id,name:now?pkey(now):((c.n||'')+' '+(c.l||'')).trim()||'Player',h,rs,best,miss,gross,short:Math.max(0,ECL_MIN-rs.length),out:over&&rs.length<ECL_MIN,net:Math.round((gross-ECL_PCT*h)*100)/100})}
  const k=net?'net':'gross',sb=(r,a,b)=>r.best.slice(a,b).reduce((t,x)=>t+(x.v||0),0),al=r=>net?ECL_PCT*r.h:0,r6=v=>Math.round(v*1e6)/1e6;
  out.forEach(r=>{r.cb=[r6(sb(r,6,9)-al(r)/3),r6(sb(r,3,9)-al(r)*2/3),r6(sb(r,8,9)-al(r)/9)]});
  const cbc=(a,b)=>{for(let i=0;i<3;i++)if(a.cb[i]!==b.cb[i])return a.cb[i]-b.cb[i];return 0};
  out.sort((a,b)=>a.out-b.out||a.miss-b.miss||a[k]-b[k]||(a.miss?0:cbc(a,b))||a.name.localeCompare(b.name));
  let rank=0;out.forEach((r,i)=>{const q=out[i-1];if(!q||q.out!==r.out||q.miss!==r.miss||q[k]!==r[k]||cbc(q,r))rank=i+1;r.rank=r.out||r.miss?null:rank;r.onCb=!!q&&r.rank!=null&&q.rank!=null&&q[k]===r[k]&&q.rank!==r.rank});
  out.forEach(r=>{r.tied=r.rank!=null&&out.filter(x=>x.rank===r.rank).length>1});return out}
const eclBy=()=>ls.get('gs-ecl-by','net')==='gross'?'gross':'net';
// the weekly update for the WhatsApp group: both tables (top 10 each), who still needs rounds, and the link to the full table
function eclMsg(){const se=eclSeason(eclY),t=today(),over=t>se.to,nr=eclRows('net'),gr=eclRows('gross'),N=10,cl=x=>String(x).replace(/[*_~`]/g,'').trim();
  const list=(rs,val)=>{const r=rs.filter(x=>x.rank!=null);if(!r.length)return 'No full cards yet';
    return r.slice(0,N).map(x=>`${x.tied?'=':''}${x.rank}. ${cl(x.name)} ${val(x)}`).join('\n')+(r.length>N?`\n…and ${r.length-N} more in the app`:'')};
  const cards=nr.reduce((a,r)=>a+r.rs.length,0),miss=nr.filter(x=>x.miss&&!x.out).map(x=>cl(x.name)),need=nr.filter(x=>!over&&x.short).map(x=>`${cl(x.name)} (${x.short} more)`),outs=nr.filter(x=>x.out).map(x=>cl(x.name));
  return [`⭐ *Eclectic ${se.name}* · ${over?'final results':'update '+dShort(t)}`,`${plur(nr.length,'player')} · ${plur(cards,'card')} in`,'',
    `🏆 *Net* (best holes minus 25% of handicap)`,list(nr,x=>fmtN(x.net)),'',`⛳ *Gross* (best score on each hole)`,list(gr,x=>x.gross),
    ...(need.length?['',`Need more rounds to qualify (${ECL_MIN} minimum): ${need.join(', ')}`]:[]),
    ...(miss.length?['',`No total yet (a hole with no score): ${miss.join(', ')}`]:[]),
    ...(outs.length?['',`Fewer than ${ECL_MIN} rounds, so not placed: ${outs.join(', ')}`]:[]),
    '',`Ties are split on countback. Full table: ${appUrl()}`].join('\n')}

// what the card being typed would do: its total, and the holes where it beats the player's best so far
function eclFormSum(){const f=eform;if(!f)return '';const vals=f.s.map(v=>+v||0),n=vals.filter(v=>v>0).length;if(!n)return 'Type the score for each hole. Leave a hole empty if they picked up.';

  return `Total <b>${vals.reduce((a,v)=>a+v,0)}</b> over ${plur(n,'hole')}${n<9?` (${9-n} with no score)`:''}.${f.id&&rs.length?(better.length?` Improves hole${better.length>1?'s':''} ${better.join(', ')}.`:' No hole improved.'):''}`}

  if(s.length%2)mid=s.splice(Math.floor(s.length/2),1)[0];
  const n=s.length/2,A=s.slice(0,n),B=s.slice(n),sum=pr=>pr.reduce((a,x)=>a+hcp(x),0);
  if(!n)return{pairs:[],left:mid};

  const score=pr=>{const t=pr.map(sum);return{pr,sp:Math.max(...t)-Math.min(...t)}};
  cands.push(score(A.map((a,i)=>[a,B[n-1-i]])));                                           // lowest with highest: about as even as it gets
  const quick=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};   // trial shuffles only
  for(let t=0;t<4000;t++){const b=quick(B);cands.push(score(A.map((a,i)=>[a,b[i]])))}
  const best=Math.min(...cands.map(c=>c.sp)),pool=cands.filter(c=>c.sp<=best+2);
  const pick=pool[rnd(pool.length)];let pairs=shuffle(pick.pr.map(pr=>shuffle(pr)));
  if(mid){const k=pairs.reduce((bi,pr,i)=>sum(pr)>sum(pairs[bi])?i:bi,0);pairs[k].push(mid);mid=null}
  return{pairs,left:mid}}
// teams of four: fours, with spares making a five (or a three), dealt like cards; with "balance"
// the average handicap of every team is then evened out
function drawFours(chosen,bal){const N=chosen.length,order=bal?shuffle(chosen).sort((a,b)=>hcp(a)-hcp(b)):shuffle(chosen);
  // fours, and the players left over join a team to make a five (a 2 would be up against it in a four-person format):
  // 13 -> 4+4+5, 9 -> 4+5, 10 -> 5+5, 14 -> 4+5+5, 7 -> 4+3, 11 -> 4+4+3; too few for that: 5 -> 3+2, 6 -> 3+3
  const split=n=>{const q=Math.floor(n/4),r=n%4;

  if(bal&&k>1){const avg=t=>t.reduce((a,x)=>a+hcp(x),0)/t.length,spread=()=>{const v=teams.map(avg);return Math.max(...v)-Math.min(...v)};let best=spread();   // then even out the average handicap per team
    for(let n=0;n<4000;n++){const a=Math.random()*k|0,b=Math.random()*k|0;if(a===b)continue;const i=Math.random()*teams[a].length|0,j=Math.random()*teams[b].length|0;
      [teams[a][i],teams[b][j]]=[teams[b][j],teams[a][i]];const sp=spread();if(sp<=best)best=sp;else[teams[a][i],teams[b][j]]=[teams[b][j],teams[a][i]]}}
  return{pairs:shuffle(teams.map(t=>shuffle(t))),left:null}}

let dsizeSet=null,tsizeNext=null;const dsz=()=>dsizeSet||(R.tsize===4||curFmt().segs.some(x=>F[x.f].need==='fours')?4:2);   // tsizeNext: the size the draw being used was made with
function drawPairs(bal){const chosen=P.filter(p=>drawSel.has(pkey(p)));

  let pl=shuffle(chosen),left=null;if(pl.length%2)left=pl.pop();

function teeGroups(items,three,tg=x=>x.tg){
  if(items.length&&items.every(x=>Number.isInteger(tg(x)))){const m=new Map();for(const x of items){const g=tg(x);if(!m.has(g))m.set(g,[]);m.get(g).push(x)}   // saved holes
    return [...m.keys()].sort((a,b)=>a-b).map(g=>({hole:g%9+1,second:g>=9,xs:m.get(g)}))}const twos=items.filter(x=>!three(x)),threes=items.filter(three),g=[];

  threes.forEach(x=>g.push([x]));if(twos.length%2)g.push([twos[twos.length-1]]);

  const next=Math.max(...have.map(x=>x.tg))+1;teeGroups(fresh,is3,()=>null).forEach(g=>g.xs.forEach(x=>x.tg=next+g.i));return pairs}

// ---------- "add to home screen" helper ----------
// A link tapped in WhatsApp opens in the phone's browser (or straight into the app if it is already installed).
// Many people don't know how to add a web app from there, so the leaderboard shows the shortest way for THIS browser:
// a one-tap Install (Chrome on Android), the right menu steps (Safari incl. the iOS 26 ⋯ layout, Chrome/Firefox on
// iPhone, Samsung Internet), or, inside another app's built-in viewer, a way out to the real browser + Copy link.
const UA=navigator.userAgent;
const isIOS=/iPhone|iPad|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isAndroid=/Android/.test(UA);
const isSamsung=/SamsungBrowser/.test(UA);
const iosOther=isIOS&&/CriOS|FxiOS|EdgiOS|OPiOS/.test(UA);
const inApp=/WhatsApp|FBAN|FBAV|FB_IAB|Instagram|Line\/|MicroMessenger|; wv\)/.test(UA)||(isIOS&&!/Safari\//.test(UA));
const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const appUrl=()=>location.origin+location.pathname;
const instOff=()=>isStandalone()||ls.get('gs-inst-done',0)||Date.now()-ls.get('gs-inst-later',0)<3*864e5;
let instEvt=null,instSteps=false;
// only take over Chrome's own install prompt when our card is going to offer it
addEventListener('beforeinstallprompt',e=>{if(!isAndroid||instOff())return;e.preventDefault();instEvt=e;renderInstall()});
addEventListener('appinstalled',()=>{instEvt=null;ls.set('gs-inst-done',1);renderInstall()});
function renderInstall(){
  const el=$('inst');if(!el)return;
  const hide=instOff()||view!=='board'||!(isIOS||isAndroid);       // desktop: nothing to do
  el.hidden=!!hide;if(hide)return;
  const u=appUrl(),host=location.host+location.pathname;
  const copy=`<button class="btn ghost" data-inst="copy">Copy link</button>`,later=`<button class="btn ghost" data-inst="later">Not now</button>`,
    skip=`<button class="skip" data-inst="later">${isIOS?'Already added, or just watching? Not now':'Not now, just watching'}</button>`;
  let sub='Then it opens like an app, straight to the scores.',body;
  if(inApp&&isAndroid){
    sub='This app’s built-in viewer can’t add it. Open it in Chrome first.';
    const intent=`intent://${host}#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=${encodeURIComponent(u)};end`;
    body=`<div class="row"><a class="btn" href="${esc(intent)}" target="_blank" rel="noopener">Open in Chrome</a>${copy}</div>
      <p class="note" style="margin:8px 0 0">Nothing happened? Tap <span class="ic">⋮</span> and choose <b>Open in Chrome</b> (or <b>Open in browser</b>), or copy the link and paste it into Chrome.</p>${skip}`}
  else if(inApp&&isIOS){
    sub='This app’s built-in viewer can’t add it. Open it in Safari first.';
    body=`<div class="row"><a class="btn" href="x-safari-${esc(u)}">Open in Safari</a>${copy}</div>
      <p class="note" style="margin:8px 0 0">Nothing happened? Tap <span class="ic">⋯</span> or the compass icon and choose <b>Open in Safari</b>, or copy the link and paste it into Safari.</p>${skip}`}
  else if(iosOther){
    body=`<ol><li>Tap <b>Share</b> <span class="ic">⬆</span> in the address bar (or in the <span class="ic">⋯</span> menu).</li><li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li></ol>${skip}`}
  else if(isIOS){
    body=`<ol><li>Tap <span class="ic">⋯</span> at the bottom, then <b>Share</b> <span class="ic">⬆</span><br><small style="color:var(--mut)">(older iPhones: just tap <b>Share</b> <span class="ic">⬆</span>)</small></li><li>Tap <b>Add to Home Screen</b> (scroll down if you don’t see it), then <b>Add</b>.</li></ol>
      <p class="note" style="margin:0">No “Add to Home Screen”? Tap the compass icon first to open this in Safari.</p>${skip}`}
  else if(isSamsung&&!instEvt){
    body=`<ol><li>Tap <span class="ic">≡</span> at the bottom right.</li><li>Tap <b>Add page to</b>, then <b>Home screen</b>.</li></ol>${skip}`}
  else{                                              // Chrome (or similar) on Android: one big button, same layout before and after the install event
    body=`<div class="row"><button class="btn" data-inst="install">Install app</button>${later}</div>${instSteps?`<ol style="margin:10px 0 0"><li>Tap <span class="ic">⋮</span> at the top right.</li><li>Tap <b>Add to Home screen</b> (or <b>Install app</b>), then <b>Install</b> / <b>Add</b>.</li></ol>
      <p class="note" style="margin:6px 0 0">No such option? Tap <span class="ic">⋮</span> → <b>Open in Chrome</b> first.</p>`:''}`}
  el.innerHTML=`<div class="ih"><img src="icon-192.png" alt=""><div><b>Add Golf Scores to your home screen</b><small>${sub}</small></div></div>${body}`}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-inst]');if(!b)return;const k=b.dataset.inst;
  if(k==='install'){
    if(instEvt){const ev=instEvt;ev.prompt().catch(()=>{});const r=await ev.userChoice.catch(()=>null);instEvt=null;if(r&&r.outcome==='accepted')ls.set('gs-inst-done',1);else instSteps=true}
    else instSteps=true;                             // no install prompt from this browser: show the menu steps instead
    renderInstall()}
  else if(k==='later'){ls.set('gs-inst-later',Date.now());renderInstall()}
  else if(k==='copy'){let ok=false;try{await navigator.clipboard.writeText(appUrl());ok=true}catch{}
    if(ok)toast('Link copied. Open '+(isIOS?'Safari':'Chrome')+', tap the address bar and paste.',4200);
    else if(!$('inst').querySelector('.lnk')){$('inst').insertAdjacentHTML('beforeend',`<span class="lnk">${esc(appUrl())}</span>`);toast('Press and hold the link to copy it',3500)}}});
renderInstall();

// ---------- phone back button (Android) ----------
// History: [root] [Leaderboard step] [other screens…] [share-image pop-up]. Back closes what is in front (the share
// image or a celebration) first, then steps back through screens. In the installed Android app, back on the
// Leaderboard asks before leaving. If a step is added with no tap since the page loaded (or since the last back),
// Chrome lets the back button skip ALL the app's steps and close it, so steps are only added after a tap, and "staying put" steps forward onto the existing
// step instead of adding a new one.
const askBeforeExit=()=>isStandalone()&&isAndroid;
const delArm={};   // past-round id -> time its 🗑 was tapped once (kept across live re-renders)
const nav={depth:0,skip:0,ov:null,guard:false};
try{history.scrollRestoration='manual'}catch{}
function armGuard(){if(nav.guard||!askBeforeExit())return;nav.guard=true;history.pushState({gs:'v',v:'board',n:0},'')}
function navTo(v){armGuard();if(v==='board'){if(nav.depth>0){nav.skip++;history.go(-nav.depth);nav.depth=0}return}
  nav.depth++;history.pushState({gs:'v',v,n:nav.depth},'')}
function ovOpen(name,close){if(nav.ov){if(nav.ov.name===name)nav.ov.close=close;return}armGuard();nav.ov={name,close};history.pushState({gs:'ov',ov:name,n:nav.depth},'')}
function ovDone(name,fn){if(nav.ov&&nav.ov.name===name&&(!fn||nav.ov.close===fn)){nav.ov=null;nav.skip++;history.back()}}
{const s0=history.state;                                             // after a reload: go back to the first step we made
  if(s0&&(s0.gs==='v'||s0.gs==='ov')){const k=(s0.n||0)+(s0.gs==='ov'?1:0)+(s0.gs==='v'&&s0.v==='board'||askBeforeExit()&&(s0.n||0)>0?1:0);if(k>0&&history.length>k){nav.skip++;history.go(-k)}else history.replaceState({gs:'root',n:0},'')}
  else history.replaceState({gs:'root',n:0},'')}
addEventListener('pointerup',armGuard,{capture:true,passive:true});   // the first tap adds the "ask before exit" step
addEventListener('popstate',e=>{
  if(nav.skip>0){nav.skip--;return}                                   // our own history.back()/go()/forward(), not the user
  if(nav.ov){const o=nav.ov;nav.ov=null;o.close();return}             // the share image: back closes it
  const st=e.state||{};
  if(st.gs==='root'){const was=nav.depth;nav.depth=0;if(nav.guard&&askBeforeExit())askExit();else if(!showView('board',true)){nav.depth=was;nav.skip++;history.forward()}return}
  if(st.gs==='v'){const was=nav.depth;nav.depth=st.n||0;if(st.v==='results')resSrc=null;   // back only ever lands on the live Results
    if(st.v!==view&&!showView(st.v,true)){nav.depth=was;nav.skip++;history.forward()}       // unsaved Setup: stay on it
    return}
  if(st.gs==='ov'){nav.skip++;history.back()}                         // a left-over pop-up step: skip it
});
function askExit(){const m=$('modal');m.dataset.kind='exit';
  m.innerHTML=`<div class="box" role="alertdialog" aria-label="Exit Golf Scores?"><h2 class="sec" style="margin:4px 0 6px">Exit Golf Scores?</h2>
    <p class="note" style="margin:0 0 12px">Press <b>back</b> again to close the app.<br>Scores keep updating when you open it again.</p>
    <button class="btn" data-exit="stay" type="button" style="width:100%">Stay</button></div>`;m.hidden=false}
function exitChoice(){const m=$('modal');m.hidden=true;m.dataset.kind='';nav.skip++;history.forward()}   // back onto the Leaderboard step
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();start();
}
