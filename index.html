<style>
/* VOICE: a clubhouse scoreboard — clear, outdoors-readable, no fuss
   IDEA: the paper scorecard and the leaderboard board by the 9th green
   PICTURE: the live leaderboard itself, big point totals
   COLOUR/TYPE: fairway green ground, white cards, flag red accent; Barlow Condensed numbers, Inter text
   LAYOUT: one column, sticky header + tabs, 44px+ targets for thumbs on the course */
:root{--g:#0e3b2c;--g2:#1f5c44;--g3:#e8f1ec;--ink:#13201a;--mut:#5b6b63;--line:#d9e2dc;--bg:#f4f7f5;--red:#e63946;--card:#fff;--gold:#f4b740;--up:#15803d;
--f0:#1f7a4d;--f1:#2b6cb0;--f2:#b7791f}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{transition:transform .08s ease,background-color .15s}
button:active{transform:scale(.96)}
.top{background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center}
.brand svg{flex:none}
h1{font:700 26px/1.05 "Barlow Condensed",system-ui,sans-serif;margin:0;letter-spacing:.2px}
.top p{margin:2px 0 0;font-size:13px;opacity:.8}
.net{font-size:12px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.net.live::before,.net.off::before,.net.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:6px;vertical-align:1px}
.net.live::before{animation:blink 2.4s ease-in-out infinite}
.net.off::before{background:#fbbf24}.net.sync::before{background:#93c5fd}
@keyframes blink{50%{opacity:.35}}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--g);padding:0 max(8px,env(safe-area-inset-left)) 8px}
.tabs button{border:0;background:none;color:#cfe3d8;padding:10px 4px;font-weight:600;font-size:15px;border-radius:10px;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button svg{width:17px;height:17px;flex:none}
.tabs button.on{background:#fff;color:var(--g)}
main{max-width:720px;margin:0 auto;padding:14px max(12px,env(safe-area-inset-left)) 40px}
main>section.show{animation:vin .22s ease-out}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.banner{background:#fff4d6;border:1px solid #f0d48a;color:#6b4e00;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.empty{text-align:center;padding:40px 16px;color:var(--mut)}
.empty .ill{font-size:46px;line-height:1;margin-bottom:10px}
.empty h2{font:700 28px "Barlow Condensed",system-ui,sans-serif;color:var(--ink);margin:0 0 6px}
/* ticker */
.tick{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 0 var(--line);overflow:hidden}
.tick summary{list-style:none;display:flex;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;min-height:48px}
.tick summary::-webkit-details-marker{display:none}
.tick .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 0 rgba(230,57,70,.6);animation:ping 1.8s infinite}
@keyframes ping{70%{box-shadow:0 0 0 8px rgba(230,57,70,0)}100%{box-shadow:0 0 0 0 rgba(230,57,70,0)}}
.tick .tx{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tick .tx.new{animation:slidein .45s ease-out}
@keyframes slidein{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.tick .age{flex:none;font-size:12px;color:var(--mut)}
.tick ul{list-style:none;margin:0;padding:0 14px 10px}
.tick li{font-size:14px;padding:6px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
.tick li span{color:var(--mut);font-size:12px;white-space:nowrap}
.tick .b,.tick li.b{color:#9a3412}
.tick .b::before,.tick li.b b::before{content:"🐦 "}
/* winner */
.win{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#0e3b2c,#1f5c44);color:#fff;border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(14,59,44,.25)}
.win .tro{font-size:40px;line-height:1}
.win b{display:block;font:700 26px/1.05 "Barlow Condensed",system-ui,sans-serif}
.win small{opacity:.85;font-size:13px}
.win .btn{margin-left:auto;background:var(--gold);color:var(--g);flex:none}
/* leaderboard */
.lb{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lb li{background:var(--card);border-radius:14px;box-shadow:0 1px 0 var(--line),0 2px 10px rgba(14,59,44,.06);overflow:hidden;position:relative}
.lb li.hot{animation:glow 1.1s ease-in-out 4}
@keyframes glow{50%{box-shadow:0 0 0 3px var(--gold),0 6px 22px rgba(244,183,64,.45)}}
.lb summary{list-style:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto 58px;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;min-height:64px}
.lb summary::-webkit-details-marker{display:none}
.pos{font:700 30px/1 "Barlow Condensed",system-ui,sans-serif;color:var(--g);text-align:center;position:relative}
.lb li:first-child .pos{color:#fff;background:var(--g);border-radius:10px;padding:6px 0}
.mv{display:block;font:700 11px/1 Inter;margin-top:3px}
.mv.up{color:var(--up)}.mv.dn{color:var(--red)}
.lb li:first-child .mv.up{color:#86efac}
.who b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--mut);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .bb{color:#9a3412;font-weight:700}
.thru{font-size:13px;color:var(--mut);white-space:nowrap;text-align:right}
.thru b{display:block;color:var(--ink);font-weight:700}
.pts{font:700 36px/1 "Barlow Condensed",system-ui,sans-serif;text-align:right}
.pts small{display:block;font:500 11px Inter;color:var(--mut)}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 14px 12px}
.seg{border-radius:10px;padding:8px;background:var(--g3);text-align:center}
.seg span{display:block;font-size:12px;color:var(--mut)}
.seg b{display:block;font:700 22px/1.1 "Barlow Condensed",system-ui,sans-serif}
.seg i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
.proj{padding:0 14px 10px;font-size:13px;color:var(--mut)}
.scroll{overflow-x:auto}
table.sc{border-collapse:collapse;width:100%;font-size:14px;margin:0 0 12px}
.sc th,.sc td{padding:6px 4px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
.sc th:first-child,.sc td:first-child{text-align:left;padding-left:14px;color:var(--mut);font-weight:500}
.sc .tot{font-weight:700}
.sc td.bd span{display:inline-block;min-width:24px;height:24px;line-height:20px;border:2px solid var(--red);border-radius:50%;color:var(--red);font-weight:700}
.dot0{box-shadow:inset 0 -3px 0 var(--f0)}.dot1{box-shadow:inset 0 -3px 0 var(--f1)}.dot2{box-shadow:inset 0 -3px 0 var(--f2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:12px 2px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.more{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
/* scoring */
.panel{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 0 var(--line);margin-bottom:12px}
label{font-size:13px;color:var(--mut);font-weight:500}
select,input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:16px}
select.need{border:2px solid var(--red);animation:nudge 1.4s ease-in-out 2}
@keyframes nudge{50%{box-shadow:0 0 0 5px rgba(230,57,70,.18)}}
input.filled{background:#fff6c2;transition:background .3s}
input:focus,select:focus,button:focus-visible{outline:3px solid #9ad3b4;outline-offset:1px}
.btn{border:0;border-radius:12px;min-height:48px;padding:10px 16px;font-weight:700;background:var(--g);color:#fff;cursor:pointer}
.btn.ghost{background:var(--g3);color:var(--g)}
.btn.warn{background:#fde8ea;color:#a01826}
.btn.warn.armed,.btn.armed{background:var(--red);color:#fff}
.btn.gold{background:var(--gold);color:var(--g)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 140px}
.hole{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 0 var(--line);border-left:6px solid var(--c);overflow:hidden;scroll-margin-top:70px}
.hh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 4px}
.hh b{font:700 24px "Barlow Condensed",system-ui,sans-serif}
.hh span{font-size:13px;color:var(--mut)}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto 48px;gap:8px;align-items:center;padding:8px 14px 12px}
.ent+.ent{border-top:1px dashed var(--line);padding-top:10px}
.ent .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .nm small{display:block;white-space:normal;font-weight:400;color:var(--mut);font-size:12px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:48px;border-radius:12px;border:0;background:var(--g3);color:var(--g);font-size:26px;font-weight:600;cursor:pointer;touch-action:manipulation}
.step button:active{transform:scale(.88);background:#cfe5d9}
.step output{width:40px;text-align:center;font:700 30px/1 "Barlow Condensed",system-ui,sans-serif}
.step output.bird{color:var(--red)}
.pop{animation:pop .32s ease-out}
@keyframes pop{40%{transform:scale(1.28)}}
.pt{text-align:center;border-radius:10px;padding:4px 0;background:var(--g3)}
.pt b{display:block;font:700 24px/1 "Barlow Condensed",system-ui,sans-serif}
.pt small{font-size:11px;color:var(--mut)}
.pt.none{opacity:.45}
.pt.hi{background:#fde8ea}
.segh{font:700 18px "Barlow Condensed",system-ui,sans-serif;letter-spacing:.3px;margin:18px 2px 8px;color:var(--c);display:flex;justify-content:space-between}
.segh span{font:500 13px Inter;color:var(--mut)}
.jump{display:block;width:100%;margin-top:10px}
/* setup */
.pair{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.pair .full{grid-column:1/-1;display:flex;gap:8px}
.pair .full input{flex:1}
.x{flex:none;width:46px;border:0;border-radius:10px;background:#fde8ea;color:#a01826;font-size:20px;cursor:pointer}
.course{border-collapse:collapse;width:100%}
.dlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:380px;overflow:auto;margin:8px 0;padding:2px}
.chk{display:flex;gap:8px;align-items:center;min-height:46px;padding:4px 10px;border-radius:10px;background:var(--g3);font-weight:600;cursor:pointer}
.chk small{font-weight:400;color:var(--mut);font-size:12px;display:block}
.chk input{width:22px;min-height:22px;height:22px;flex:none;accent-color:var(--g);margin:0}
.dres{margin-top:10px;display:grid;gap:6px}.dres div{display:flex;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.dres b{font-family:"Barlow Condensed",system-ui,sans-serif;font-size:20px}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 72px 46px;gap:6px;padding:5px 0}
details.panel>summary{list-style:none}details.panel>summary::before{content:"▸ ";color:var(--g)}details[open].panel>summary::before{content:"▾ "}
.course td,.course th{padding:3px;text-align:center;font-size:13px;color:var(--mut)}
.course input{min-width:44px;padding:6px 2px;text-align:center}
h2.sec{font:700 22px "Barlow Condensed",system-ui,sans-serif;margin:0 0 8px}
.note{font-size:13px;color:var(--mut);margin:6px 0 0}
.note.warn{color:#a01826}
/* results + history */
.rhead{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.rhead h2{font:700 30px/1 "Barlow Condensed",system-ui,sans-serif;margin:0}
.rhead small{display:block;color:var(--mut);font-size:13px}
.back{border:0;background:var(--g3);color:var(--g);border-radius:10px;min-height:44px;padding:0 12px;font-weight:700;cursor:pointer;flex:none}
.stand{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:8px}
.stand li{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:10px 14px;box-shadow:0 1px 0 var(--line)}
.stand .md{font-size:26px;text-align:center;font-weight:700;font-family:"Barlow Condensed",system-ui,sans-serif;color:var(--g)}
.stand li:first-child{background:linear-gradient(135deg,#fff8e6,#fff);box-shadow:0 0 0 2px var(--gold)}
.stand .sp{font-size:12px;color:var(--mut)}
.hls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.hlc{background:var(--card);border-radius:14px;padding:12px;box-shadow:0 1px 0 var(--line);border-top:4px solid var(--c,var(--g))}
.hlc span{display:block;font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.hlc b{display:block;font:700 22px/1.1 "Barlow Condensed",system-ui,sans-serif;margin:4px 0 2px}
.hlc small{font-size:13px;color:var(--mut)}
.hist{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.hist button{width:100%;text-align:left;border:0;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 0 var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
.hist b{display:block}.hist small{color:var(--mut);font-size:13px}
.hist .w{font:700 22px "Barlow Condensed",system-ui,sans-serif;color:var(--g);white-space:nowrap}
#modal{position:fixed;inset:0;background:rgba(10,30,22,.72);z-index:60;display:flex;align-items:center;justify-content:center;padding:20px}
#modal[hidden]{display:none}
#modal .box{background:#fff;border-radius:16px;padding:14px;max-width:420px;width:100%;max-height:90vh;overflow:auto;text-align:center}
#modal img{width:100%;border-radius:10px;display:block;margin-bottom:10px}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:80;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}
</style>

const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(12)}catch{}};
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()};

function toast(t,ms=2400){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),ms)}
function net(state){const e=$('net');e.className='net '+({live:'live',off:'off',sync:'sync'}[state]||'');e.textContent={live:'Live',off:'Offline · will sync',sync:'Saving…',demo:'Demo mode'}[state]||'Connecting…'}

// ---------- scoring maths ----------
const fmtOf=h=>h<=3?0:h<=6?1:2;
const r1=x=>Math.sign(x)*Math.round(Math.abs(x));             // round half away from zero (plus handicaps round the same way)
const fmtH=h=>{if(h===''||h==null)return '';const n=+h;return n<0?'+'+(-n):String(h)};
function ranks(si){const o=si.map((v,i)=>[+v||99,i]).sort((a,b)=>a[0]-b[0]||a[1]-b[1]);const r=[];o.forEach(([,i],k)=>r[i]=k+1);return r}
function strokes(ph,r){if(ph>=0)return Math.floor(ph/9)+(r<=ph%9?1:0);const m=-ph;return -(Math.floor(m/9)+(r>9-m%9?1:0))}
const is3=p=>!!(p.p3&&String(p.p3).trim());
function phs(p){const a=(+p.h1||0)/2,b=(+p.h2||0)/2,c=(+p.h3||0)/2;
  if(is3(p)){const [lo,mid,hi]=[a,b,c].sort((x,y)=>x-y);
    return{a:r1(.75*a),b:r1(.75*b),c:r1(.75*c),g:r1(.5*lo+.3*mid+.2*hi),s:r1(.3*lo+.2*mid+.1*hi)}}
  const lo=Math.min(a,b),hi=Math.max(a,b);
  return{a:r1(.75*a),b:r1(.75*b),g:r1(.6*lo+.4*hi),s:r1(.35*lo+.15*hi)}}
const pn=(p,k)=>({a:p.p1,b:p.p2,c:p.p3}[k])||({a:'Player 1',b:'Player 2',c:'Player 3'}[k]);
const teamName=p=>p.name||[p.p1||'Player 1',p.p2||'Player 2',...(is3(p)?[p.p3]:[])].join(' & ');
function card(p,RR=R,SS=S){
  const P=phs(p),rk=ranks(RR.si||DEF.si),sc=(SS&&SS[p.id])||{},three=is3(p);let tot=0,thru=0,done6=0,last=0;const seg=[0,0,0],holes=[];
  for(let h=1;h<=9;h++){const i=h-1,par=+(RR.par||DEF.par)[i]||4,f=fmtOf(h);
    const rows=f===0?[['a',pn(p,'a'),P.a],['b',pn(p,'b'),P.b],...(three?[['c',pn(p,'c'),P.c]]:[])]:[['',f===1?'Greensomes ball':'Scramble ball',f===1?P.g:P.s]];
    const e=rows.map(([k,l,ph])=>{const key=h+k,g=sc[key],gross=(g===undefined||g===null||g==='')?null:+g,st=strokes(ph,rk[i]);
      const pt=gross===null?null:gross===0?0:Math.max(0,par+2-(gross-st));return{key,label:l,ph,st,gross,pt,bird:gross!==null&&gross>0&&gross<=par-1}});
    const got=e.filter(x=>x.pt!==null),done=got.length===e.length;
    let counted=got;
    if(f===0&&three&&got.length===3){const low=[...got].sort((x,y)=>x.pt-y.pt||(y.gross||99)-(x.gross||99))[0];low.drop=true;counted=got.filter(x=>x!==low)}
    const hp=counted.reduce((a,x)=>a+x.pt,0);tot+=hp;seg[f]+=hp;if(got.length)last=h;
    if(done){thru++;done6+=hp}holes.push({h,par,si:(RR.si||DEF.si)[i],f,e,done,hp:got.length?hp:null,birdie:counted.some(x=>x.bird)})}
  let on=null;if(last){on=holes[last-1].done?null:last;if(!on){for(let k=0;k<9;k++){const hh=holes[(last+k)%9];if(!hh.done){on=hh.h;break}}}}
  const proj=thru>=3&&thru<9?Math.round(done6/thru*9):null;     // too jumpy before 3 holes
  return{P,tot,seg,thru,holes,three,on,proj,started:!!last,birdies:holes.reduce((a,h)=>a+h.e.filter(x=>x.bird&&!x.drop).length,0)}}
function standings(RR=R,SS=S){
  const rows=(RR.pairs||[]).map(p=>({p,c:card(p,RR,SS)}));
  const fin=rows.length>0&&rows.every(r=>r.c.thru===9);
  const cb=c=>[c.seg[2],c.seg[1]+c.seg[2],c.holes[8].hp||0];      // countback: last 3, last 6, last hole
  const cmpCb=(x,y)=>{const a=cb(x.c),b=cb(y.c);for(let i=0;i<3;i++)if(a[i]!==b[i])return b[i]-a[i];return 0};
  rows.sort((x,y)=>y.c.tot-x.c.tot||(fin?cmpCb(x,y):y.c.thru-x.c.thru)||teamName(x.p).localeCompare(teamName(y.p)));
  let rank=0;rows.forEach((r,i)=>{const pr=rows[i-1];if(!pr||pr.c.tot!==r.c.tot||(fin&&cmpCb(pr,r)!==0))rank=i+1;r.rank=rank});
  const cbWin=fin&&rows.length>1&&rows[0].c.tot===rows[1].c.tot&&rows[0].rank!==rows[1].rank;
  return{rows,fin,cbWin}}
const resWord=(g,par)=>g===0?'picked up':g===1?'HOLE IN ONE':(d=>d<=-3?'albatross':d===-2?'eagle':d===-1?'birdie':d===0?'par':d===1?'bogey':d===2?'double bogey':d===3?'triple bogey':'+'+d)(g-par);
const ago=t=>{const s=Math.max(0,(Date.now()-t)/1000|0);return s<45?'now':s<3600?Math.round(s/60)+'m':Math.round(s/3600)+'h'};
const sig=()=>R.pairs.map(p=>p.id).join(',');

// ---------- live feed (ticker), movement arrows, birdie highlights ----------
let feed=ls.get('gs-feed-sig','')===sig()?ls.get('gs-feed',[]):[];const hot={},moves={};let lastRanks=null,tickNew=0;
function saveFeed(){ls.set('gs-feed',feed);ls.set('gs-feed-sig',sig())}
function noteChange(pid,key,g){
  if(ls.get('gs-feed-sig','')!==sig()){feed=[]}
  const p=R.pairs.find(x=>x.id===pid);feed=feed.filter(e=>!(e.pid===pid&&e.key===key));
  if(!p||g==null){saveFeed();return}
  const h=parseInt(key),c=card(p),hole=c.holes[h-1],e=hole&&hole.e.find(x=>x.key===key);if(!e){saveFeed();return}
  const who=/[abc]$/.test(key)?e.label+' ':'',b=e.bird;
  feed.unshift({t:Date.now(),pid,key,b,txt:`${teamName(p)}: ${who}${resWord(+g,hole.par)} on ${h}, ${e.pt} pt${e.pt===1?'':'s'}`});
  feed=feed.slice(0,12);saveFeed();tickNew=Date.now();if(b)hot[pid]=Date.now()}

// ---------- rendering ----------
function render(kind){
  $('title').textContent=R.title||'Golf Scores';$('sub').textContent=R.course||'';
  if(view==='board')renderBoard();
  else if(view==='score'){if(document.activeElement&&document.activeElement.id==='pairsel')return;renderScore()}
  else if(view==='results')renderResults();
  else if(view==='hist')renderHist();
  else if(kind!=='scores'&&!setupDirty)renderSetup();     // scores arriving never wipe the organiser's Setup screen
}
function renderBoard(){
  const el=$('v-board');
  if(!R.pairs.length){el.innerHTML=`<div class="empty"><div class="ill">⛳</div><h2>No pairs yet</h2><p>The organiser draws the teams in <b>Setup</b>. The leaderboard appears here as soon as they do.</p></div>${moreBtns()}`;return}
  const {rows,fin,cbWin}=standings();
  // movement arrows: compare with the last ranks we showed
  const now=Date.now(),nr={};rows.forEach(r=>nr[r.p.id]=r.rank);
  if(lastRanks)for(const id in nr){const o=lastRanks[id];if(o&&o!==nr[id])moves[id]={d:o-nr[id],t:now}}
  lastRanks=nr;
  const before={};el.querySelectorAll('.lb li').forEach(li=>before[li.dataset.id]=li.getBoundingClientRect().top);
  const open=new Set([...el.querySelectorAll('.lb details[open]')].map(d=>d.dataset.id));
  const tk=feed[0],fresh=tk&&tickNew&&now-tickNew<1500;
  const ticker=`<details class="tick"${el.querySelector('.tick[open]')?' open':''}><summary><span class="dot"></span>${tk?`<span class="tx${fresh?' new':''} ${tk.b?'b':''}">${esc(tk.txt)}</span><span class="age">${ago(tk.t)}</span>`:`<span class="tx" style="font-weight:500;color:var(--mut)">Live updates appear here as scores come in</span>`}</summary>
    ${feed.length>1?`<ul>${feed.slice(1,8).map(e=>`<li class="${e.b?'b':''}"><b style="font-weight:500">${esc(e.txt)}</b><span>${ago(e.t)}</span></li>`).join('')}</ul>`:''}</details>`;
  const w=rows[0];
  const win=fin?`<div class="win"><div class="tro">🏆</div><div><b>${esc(teamName(w.p))} win!</b><small>${w.c.tot} pts${cbWin?' · on countback':''}</small></div><button class="btn" data-go="results">Results</button></div>`:'';
  el.innerHTML=win+ticker+`<ol class="lb">${rows.map(({p,c,rank})=>{
    const mv=moves[p.id]&&now-moves[p.id].t<120000?moves[p.id].d:0,hb=feed.find(e=>e.pid===p.id&&e.b&&now-e.t<900000);
    const st=c.thru===9?`<b>Finished</b>${c.birdies?`${c.birdies} birdie${c.birdies>1?'s':''}`:''}`:c.started?`<b>On ${c.on}</b>${c.proj!=null?`proj ${c.proj}`:`thru ${c.thru}`}`:`<b>Not started</b>`;
    return `<li data-id="${esc(p.id)}" class="${hot[p.id]&&now-hot[p.id]<6000?'hot':''}"><details data-id="${esc(p.id)}" ${open.has(p.id)?'open':''}><summary>
      <span class="pos">${rank}${mv?`<i class="mv ${mv>0?'up':'dn'}">${mv>0?'▲':'▼'}${Math.abs(mv)}</i>`:''}</span>
      <span class="who"><b>${esc(teamName(p))}</b><small>${hb?`<span class="bb">🐦 Birdie on ${parseInt(hb.key)}!</span>`:`${esc(p.p1||'')} ${esc(fmtH(p.h1))} · ${esc(p.p2||'')} ${esc(fmtH(p.h2))}${c.three?` · ${esc(p.p3)} ${esc(fmtH(p.h3))}`:''}`}</small></span>
      <span class="thru">${st}</span>
      <span class="pts">${c.tot}<small>pts</small></span></summary>
      <div class="segs">${FMT.map((f,k)=>`<div class="seg" style="box-shadow:inset 0 3px 0 ${f.c}"><span>${f.n}</span><b>${c.seg[k]}</b><i>${k===0?`gets ${fmtH(c.P.a)} / ${fmtH(c.P.b)}${c.three?' / '+fmtH(c.P.c):''}`:`gets ${fmtH(k===1?c.P.g:c.P.s)}`}</i></div>`).join('')}</div>
      ${c.proj!=null?`<div class="proj">On pace for about <b>${c.proj} pts</b> after 9 holes.</div>`:''}
      <div class="scroll"><table class="sc"><tr><th>Hole</th>${c.holes.map(h=>`<th class="dot${h.f}">${h.h}</th>`).join('')}<th>Tot</th></tr>
      <tr><td>Par</td>${c.holes.map(h=>`<td>${h.par}</td>`).join('')}<td>${c.holes.reduce((a,h)=>a+h.par,0)}</td></tr>
      <tr><td>Points</td>${c.holes.map(h=>`<td class="${h.birdie?'bd':''}"><span>${h.hp??'–'}</span></td>`).join('')}<td class="tot">${c.tot}</td></tr></table></div>
    </details></li>`}).join('')}</ol>
    <div class="legend">${FMT.map((f,k)=>`<span style="--c:${f.c}">Holes ${k*3+1}–${k*3+3} ${f.n}</span>`).join('')}<span style="--c:var(--red)">Circled = birdie or better</span></div>${moreBtns()}`;
  if(!reduce)el.querySelectorAll('.lb li').forEach(li=>{const b=before[li.dataset.id];if(b==null)return;const d=b-li.getBoundingClientRect().top;
    if(Math.abs(d)>2)li.animate([{transform:`translateY(${d}px)`},{transform:'none'}],{duration:650,easing:'cubic-bezier(.2,.8,.2,1)'})});
  if(fin)celebrate(rows);
}
const moreBtns=()=>`<div class="more"><button class="btn ghost" data-go="results">📊 Results</button><button class="btn ghost" data-go="hist">🗂 Past rounds</button></div>`;
function celebrate(rows){const k='fin:'+sig()+':'+rows.map(r=>r.c.tot).join('-');if(ls.get('gs-cele','')===k)return;ls.set('gs-cele',k);confetti();toast('🏆 Round complete! '+teamName(rows[0].p)+' win',3500)}
function confetti(){if(reduce)return;const c=document.createElement('canvas');c.id='confetti';document.body.appendChild(c);const x=c.getContext('2d'),dpr=Math.min(2,devicePixelRatio||1);
  const W=c.width=innerWidth*dpr,H=c.height=innerHeight*dpr;const cols=['#e63946','#f4b740','#4ade80','#ffffff','#2b6cb0','#1f7a4d'];
  const ps=[...Array(170)].map(()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*16*dpr,vy:(-Math.random()*16-6)*dpr,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,w:(6+Math.random()*7)*dpr,h:(4+Math.random()*5)*dpr,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();(function fr(t){const k=(t-t0)/1000;x.clearRect(0,0,W,H);for(const p of ps){p.vy+=.45*dpr;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.globalAlpha=Math.max(0,1-k/4.2);x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.h/2,p.w,p.h);x.restore()}
    if(k<4.2)requestAnimationFrame(fr);else c.remove()})(t0)}
function pinForm(msg,role='scorer'){const a=role==='admin';return `<div class="panel"><h2 class="sec">${a?'Organiser sign-in':'Scorer sign-in'}</h2><p class="note" style="margin:0 0 10px">${msg}</p>
  <form class="row pinf" data-role="${role}"><div><label for="pin-${role}">${a?'Admin password':'Round PIN'}</label><input id="pin-${role}" type="password" autocomplete="current-password" required></div><button class="btn" style="flex:0 0 auto">Unlock</button></form></div>`}
const myPair=()=>{const m=ls.get('gs-pair',null);return R.pairs.some(p=>p.id===m)?m:null};
function renderScore(){
  const el=$('v-score');
  if(!user){el.innerHTML=pinForm('Enter the scorer PIN to record scores. Anyone can view the leaderboard without it.');return}
  if(!R.pairs.length){el.innerHTML=`<div class="empty"><div class="ill">📝</div><h2>No pairs yet</h2><p>Wait for the organiser to draw the teams in <b>Setup</b>, then pick your pair here.</p></div>`;return}
  const mine=myPair(),had=ls.get('gs-pair',null);
  const sel=`<label for="pairsel">Scoring for</label><select id="pairsel" class="${mine?'':'need'}">${mine?'':`<option value="" selected disabled>Choose your pair…</option>`}${R.pairs.map(x=>`<option value="${esc(x.id)}" ${x.id===mine?'selected':''}>${esc(teamName(x))}</option>`).join('')}</select>`;
  if(!mine){el.innerHTML=`<div class="panel">${sel}<p class="note ${had?'warn':''}">${had?'The pairs have changed since you last scored. ':''}Pick your pair to start. One scorer per pair.</p></div>`;return}
  const p=R.pairs.find(x=>x.id===mine),c=card(p);
  const pop=lastPop&&Date.now()-lastPop.t<700&&lastPop.pid===mine?lastPop.key:null;
  el.innerHTML=`<div class="panel">${sel}
    <p class="note">Total <b>${c.tot} pts</b> · ${c.thru===9?'finished 🎉':'thru '+c.thru}. Tap + to start at par. Below 1 = pick-up (0 pts).</p>
    ${c.on&&c.thru<9?`<button class="btn ghost jump" data-jump="${c.on}">Go to hole ${c.on} ↓</button>`:''}</div>`+
  c.holes.map(h=>(h.h%3===1?`<div class="segh" style="--c:${FMT[h.f].c}">${FMT[h.f].n} · holes ${h.h}–${h.h+2}${h.f===0&&c.three?' · best 2 of 3 count':''}<span>${c.seg[h.f]} pts</span></div>`:'')+
   `<div class="hole" id="hole-${h.h}" style="--c:${FMT[h.f].c}"><div class="hh"><b>Hole ${h.h}</b><span>Par ${h.par} · SI ${esc(h.si)}</span></div>${h.e.map(x=>`
    <div class="ent"><div class="nm">${esc(x.label)}<small>${x.st>0?`${x.st} shot${x.st>1?'s':''} here`:x.st<0?`gives ${-x.st} back`:'no shot'} · plays off ${fmtH(x.ph)}</small></div>
    <div class="step"><button data-k="${x.key}" data-d="-1" aria-label="Minus">−</button><output class="${x.bird?'bird ':''}${pop===x.key?'pop':''}">${x.gross===null?'–':x.gross===0?'P/U':x.gross}</output><button data-k="${x.key}" data-d="1" aria-label="Plus">+</button></div>
    <div class="pt ${x.pt===null||x.drop?'none':''} ${x.pt>=4&&!x.drop?'hi':''} ${pop===x.key?'pop':''}"><b>${x.pt??'–'}</b><small>${x.drop?'not counted':'pts'}</small></div></div>`).join('')}</div>`).join('');
}

  if(!isAdmin()){el.innerHTML=pinForm('Setup is for organisers only: pairs, handicaps, players, archiving and clearing scores. The scorer PIN does not open it.','admin');return}

  const keys=new Set(P.map(pkey));for(const k of[...drawSel])if(!keys.has(k))drawSel.delete(k);   // drop ticks for players no longer on the list
  const scored=R.pairs.some(p=>Object.values(S[p.id]||{}).some(v=>v!=null));
  el.innerHTML=`<div class="panel"><h2 class="sec">Round</h2><div class="row">
    <div><label for="t-title">Title</label><input id="t-title" value="${esc(R.title)}"></div>
    <div><label for="t-course">Course</label><input id="t-course" value="${esc(R.course)}"></div></div></div>

    <div class="dlist" id="dlist">${[...P].sort((a,b)=>a.n.localeCompare(b.n)).map(p=>{const k=pkey(p),q=k.toLowerCase();return `<label class="chk" data-q="${esc(q)}" ${dq&&!q.includes(dq)?'hidden':''}><input type="checkbox" data-dp="${esc(k)}" ${drawSel.has(k)?'checked':''}><span>${esc(p.n)}<small>${esc(p.l)} · ${esc(fmtH(p.h))}</small></span></label>`}).join('')}</div>
    <label class="chk" style="background:none;padding:0"><input type="checkbox" id="dbal" ${dbal?'checked':''}><span>Balance by handicap<small>Pairs a low handicap with a high one</small></span></label>
    <button class="btn" id="ddraw" type="button" style="width:100%;margin-top:8px">Draw pairs (<span id="dcount">${drawSel.size}</span> playing)</button>
    <div id="dres" class="dres"></div></div>
  <div class="panel"><h2 class="sec">Pairs</h2><p class="note" style="margin:0">Start typing a player's name and pick them from the list. Their handicap fills in automatically. Use normal 18-hole handicaps; the app halves them for 9 holes and applies each format's %. Plus handicaps: type +2 (or −2).</p>
    <datalist id="roster">${[...P].sort((a,b)=>a.n.localeCompare(b.n)).map(p=>`<option value="${esc(p.n)}">${esc(p.n+' '+p.l+' · '+fmtH(p.h))}</option>`).join('')}</datalist>
    <div id="pairs">${R.pairs.map(pairRow).join('')}</div>

  <details class="panel"><summary class="sec" style="cursor:pointer">Players &amp; handicaps (${P.length})</summary>
    <p class="note">Update a handicap here once and it fills in automatically from then on. Changes don't alter pairs already saved: re-pick the name to refresh.</p>
    <div id="players">${[...P].sort((a,b)=>a.n.localeCompare(b.n)).map(playerRow).join('')}</div>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="addpl" type="button">+ Add player</button><button class="btn" id="savep" type="button">Save players</button></div></details>
  <div class="panel"><h2 class="sec">Course card</h2><div class="scroll"><table class="course"><tr><th></th>${[...Array(9)].map((_,i)=>`<th>${i+1}</th>`).join('')}</tr>
    <tr><th>Par</th>${R.par.map((v,i)=>`<td><input inputmode="numeric" data-par="${i}" value="${esc(v)}" aria-label="Par hole ${i+1}"></td>`).join('')}</tr>
    <tr><th>SI</th>${R.si.map((v,i)=>`<td><input inputmode="numeric" data-si="${i}" value="${esc(v)}" aria-label="Stroke index hole ${i+1}"></td>`).join('')}</tr></table></div>
    <p class="note">Strokes go to the lowest SI first. Change these if you play the back 9.</p></div>
  <button class="btn" id="save" type="button" style="width:100%">Save setup</button>
  <div class="panel" style="margin-top:16px"><h2 class="sec">Finish the round</h2>
    <p class="note" style="margin:0 0 10px">Archive saves the final standings to <b>Past rounds</b> for everyone to see. Then clear the scores for the next round.</p>
    <div class="row"><button class="btn gold" id="arch" type="button" ${scored?'':'disabled style="opacity:.5"'}>🗂 Archive this round</button>
    <button class="btn warn" id="clear" type="button">Clear all scores</button></div></div>
  <div class="panel"><h2 class="sec">Other</h2><div class="row">
    <button class="btn ghost" id="out" type="button">Lock (sign out)</button></div><p class="note">Signed in as organiser. You can also enter scores.</p></div>`;

}

  <div class="full"><input data-f="name" placeholder="Team name (optional)" value="${esc(p.name||'')}"><button class="x" type="button" data-rm aria-label="Remove pair">×</button></div>

const parseH=v=>{v=String(v??'').trim().replace(/\s/g,'');if(v==='')return 0;const n=parseFloat(v.replace(/^\+/,'-').replace(/^[−–]/,'-').replace(',','.'));return isFinite(n)?n:0};

function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function drawPairs(bal){let pl=shuffle(P.filter(p=>drawSel.has(pkey(p))));let left=null;
  if(pl.length%2){left=pl.pop()}
  let pairs=[];
  if(bal){pl.sort((a,b)=>(+a.h||0)-(+b.h||0));const h=pl.length/2;for(let i=0;i<h;i++)pairs.push([pl[i],pl[pl.length-1-i]]);pairs=shuffle(pairs)}
  else for(let i=0;i<pl.length;i+=2)pairs.push([pl[i],pl[i+1]]);
  if(left&&pairs.length){let k;if(bal){const sum=pr=>pr.reduce((a,x)=>a+(+x.h||0),0);k=pairs.reduce((bi,pr,i)=>Math.abs(sum(pr)/2-(+left.h||0))>Math.abs(sum(pairs[bi])/2-(+left.h||0))?i:bi,0)}else k=rnd(pairs.length);pairs[k].push(left);left=null}
  return{pairs,left}}
function drawName(x,all){return all.filter(y=>y.n===x.n).length>1?`${x.n} ${(x.l||'')[0]||''}`.trim():x.n}

  (draft.pairs.some(pr=>pr.length===3)?`<p class="note">Odd number, so one team of three. They count the best 2 of 3 scores on holes 1–3, with adjusted Greensomes and Scramble handicaps.</p>`:'')+

function liveSrc(){return{R,S,live:true}}
function summary(src){
  const {rows,fin,cbWin}=standings(src.R,src.S);let best=null;const fmtBest=[null,null,null];let birdies=0;
  rows.forEach(({p,c})=>{c.holes.forEach(h=>{if(h.hp!=null&&(!best||h.hp>best.pts))best={p,h:h.h,pts:h.hp}});birdies+=c.birdies;
    c.seg.forEach((v,k)=>{if(!fmtBest[k]||v>fmtBest[k].pts)fmtBest[k]={p,pts:v}})});
  return{rows,fin,cbWin,best,fmtBest,birdies,any:rows.some(r=>r.c.started)}}
function renderResults(){
  const el=$('v-results'),src=resSrc||liveSrc(),RR=src.R;

    </div>

}

const tm={},pend={};
function setScore(pid,key,val){
  (S[pid]??={})[key]=val;noteChange(pid,key,val);lastPop={pid,key,t:Date.now()};
  if(LOCAL){ls.set('gs-demo-S',S);render('scores');return}
  (pend[pid]??={})[key]=val;render('scores');

// new scores from the server / another tab: work out what changed (ticker + "changed on another phone")
function applyScores(n){
  const old=S,changed=[];
  if(ready)for(const pid of new Set([...Object.keys(old),...Object.keys(n)])){const a=old[pid]||{},b=n[pid]||{};
    for(const k of new Set([...Object.keys(a),...Object.keys(b)])){const va=a[k]??null,vb=b[k]??null;if(va!==vb&&!(pend[pid]&&k in pend[pid]))changed.push([pid,k,vb])}}
  S=n;const mine=myPair(),other=new Set();
  for(const [pid,k,v] of changed){noteChange(pid,k,v);if(view==='score'&&pid===mine)other.add(parseInt(k))}
  if(other.size)toast(`Hole ${[...other].sort((a,b)=>a-b).join(', ')} updated on another phone. One scorer per pair, please!`,3800);
  render('scores')}

  else if(t.id==='addpl'){$('players').insertAdjacentHTML('beforeend',playerRow({}));setupDirty=true}
  else if(t.matches('[data-prm]')){t.closest('.prow').remove();setupDirty=true}
  else if(t.id==='savep'){const list=[...document.querySelectorAll('.prow')].map(r=>({n:r.querySelector('[data-pn]').value.trim(),l:r.querySelector('[data-pl]').value.trim(),h:parseH(r.querySelector('[data-ph]').value)})).filter(p=>p.n);
    const seen=new Set(),dup=list.find(p=>{const k=pkey(p).toLowerCase();if(seen.has(k))return true;seen.add(k)});if(dup){toast(`${pkey(dup)} is on the list twice`);return}
    try{t.disabled=true;await savePlayers(list);P=list;setupDirty=false;toast('Players saved')}catch(err){toast('Not saved: '+(err.code||err.message))}finally{t.disabled=false}}
  else if(t.id==='save'){const pairs=[...document.querySelectorAll('.pair')].map(r=>{const o={id:r.dataset.id};
      r.querySelectorAll('[data-f]').forEach(i=>{const f=i.dataset.f,v=i.value.trim();if((f==='p3'||f==='h3')&&!r.querySelector('[data-f=p3]').value.trim())return;o[f]=f[0]==='h'?parseH(v):v});return o});
    const par=[...document.querySelectorAll('[data-par]')].map(i=>Math.min(7,Math.max(3,parseInt(i.value)||4))),si=[...document.querySelectorAll('[data-si]')].map(i=>parseInt(i.value)||0);
    if(new Set(si).size!==9||si.some(v=>v<1||v>18)){toast('Each hole needs its own SI (1–18). Check the course card.');return}
    try{t.disabled=true;await saveRound({title:$('t-title').value.trim(),course:$('t-course').value.trim(),par,si,pairs});setupDirty=false;toast('Setup saved')}
    catch(err){toast('Not saved: '+(err.code||err.message))}finally{t.disabled=false}}
  else if(t.id==='arch'){if(!t.classList.contains('armed')){t.classList.add('armed');t.textContent='Tap again to archive';setTimeout(()=>{t.classList.remove('armed');t.textContent='🗂 Archive this round'},4000);return}
    t.classList.remove('armed');t.textContent='🗂 Archive this round';
    try{t.disabled=true;await archiveRound();toast('Round archived to Past rounds. Clear the scores when you are ready for the next one.',4000)}catch(err){toast('Not archived: '+(err.code||err.message)+(String(err.code).includes('permission')?' (Firestore rules need updating)':''),5000)}finally{t.disabled=false}}
  else if(t.id==='clear'){if(!t.classList.contains('armed')){t.classList.add('armed');t.textContent='Tap again to clear every score';setTimeout(()=>{t.classList.remove('armed');t.textContent='Clear all scores'},4000);return}
    t.classList.remove('armed');t.textContent='Clear all scores';
    if(LOCAL){S={};ls.set('gs-demo-S',S);feed=[];saveFeed();render();toast('Scores cleared');return}
    try{await Promise.all(Object.keys(S).map(id=>fs.deleteDoc(fs.doc(db,'scores',id))));feed=[];saveFeed();toast('Scores cleared')}catch(err){toast('Not cleared: '+(err.code||err.message))}}
  else if(t.id==='out'){if(LOCAL){user=null;render()}else{await au.signOut(auth)}}});
setInterval(()=>{if(view==='board'&&!document.hidden)renderBoard()},30000);

// ---------- start ----------
async function start(){
  if(LOCAL){
    $('banner').innerHTML=`<div class="banner"><b>Demo mode.</b> Not connected to Firebase yet. Anything entered stays on this phone only. Any PIN unlocks.</div>`;
    net('demo');R={...structuredClone(DEF),...ls.get('gs-demo-R',{})};S=ls.get('gs-demo-S',{});P=ls.get('gs-demo-P',P);render();ready=true;
    addEventListener('storage',e=>{if(e.key==='gs-demo-S')applyScores(ls.get('gs-demo-S',{}));else if(e.key==='gs-demo-R'){R={...structuredClone(DEF),...ls.get('gs-demo-R',{})};render('round')}else if(e.key==='gs-demo-P'){P=ls.get('gs-demo-P',P);render('roster')}});
    return}
  try{
    const [appM,fsM,auM]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-firestore.js'),import(SDK+'firebase-auth.js')]);
    fs=fsM;au=auM;const app=appM.initializeApp(firebaseConfig);
    try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch{db=fs.getFirestore(app)}
    auth=au.getAuth(app);
    au.onAuthStateChanged(auth,u=>{user=u;render()});
    const slow=setTimeout(()=>net('off'),10000);setTimeout(()=>{ready=true},8000);
    fs.onSnapshot(fs.doc(db,'rounds','roster'),s=>{const d=s.exists()&&s.data().players;if(Array.isArray(d)&&d.length){P=d;render('roster')}},()=>{});
    fs.onSnapshot(fs.doc(db,'rounds','current'),{includeMetadataChanges:true},s=>{
      if(s.exists())R={...structuredClone(DEF),...s.data()};
      if(!s.metadata.fromCache){clearTimeout(slow);net('live')}render('round')},e=>{net('off');toast('Cannot load round: '+e.code)});
    fs.onSnapshot(fs.collection(db,'scores'),{includeMetadataChanges:true},q=>{
      const n={};q.forEach(d=>{n[d.id]={...(d.data().s||{})}});
      for(const pid in pend)Object.assign(n[pid]??={},pend[pid]);
      applyScores(n);if(!q.metadata.fromCache)ready=true;
      net(q.metadata.fromCache?'off':q.metadata.hasPendingWrites?'sync':'live')},e=>toast('Cannot load scores: '+e.code));
    addEventListener('offline',()=>net('off'));
  }catch(err){net('off');$('banner').innerHTML=`<div class="banner">Could not connect. Check the internet and reopen the app.</div>`}
}
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();start();
}
</script>
