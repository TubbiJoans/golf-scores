<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e3b2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golf Scores">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Golf Scores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a clubhouse scoreboard — clear, outdoors-readable, no fuss
   IDEA: the paper scorecard and the leaderboard board by the 9th green
   PICTURE: the live leaderboard itself, big point totals
   COLOUR/TYPE: fairway green ground, white cards, flag red accent; Barlow Condensed numbers, Inter text
   LAYOUT: one column, sticky header + tabs, 44px+ targets for thumbs on the course */
:root{--g:#0e3b2c;--g2:#1f5c44;--g3:#e8f1ec;--ink:#13201a;--mut:#5b6b63;--line:#d9e2dc;--bg:#f4f7f5;--red:#e63946;--card:#fff;
--f0:#1f7a4d;--f1:#2b6cb0;--f2:#b7791f}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
button,input,select{font:inherit;color:inherit}
.top{background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:10px;align-items:center}
.brand svg{flex:none}
h1{font:700 26px/1.05 "Barlow Condensed",system-ui,sans-serif;margin:0;letter-spacing:.2px}
.top p{margin:2px 0 0;font-size:13px;opacity:.8}
.net{font-size:12px;padding:4px 9px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.net.live::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#4ade80;margin-right:6px;vertical-align:1px}
.net.off::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#fbbf24;margin-right:6px;vertical-align:1px}
.tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--g);padding:0 max(8px,env(safe-area-inset-left)) 8px}
.tabs button{border:0;background:none;color:#cfe3d8;padding:10px 4px;font-weight:600;font-size:15px;border-radius:10px;min-height:44px}
.tabs button.on{background:#fff;color:var(--g)}
main{max-width:720px;margin:0 auto;padding:14px max(12px,env(safe-area-inset-left)) 40px}
.banner{background:#fff4d6;border:1px solid #f0d48a;color:#6b4e00;border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.empty{text-align:center;padding:48px 16px;color:var(--mut)}
.empty h2{font:700 28px "Barlow Condensed",system-ui,sans-serif;color:var(--ink);margin:0 0 6px}
/* leaderboard */
.lb{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.lb li{background:var(--card);border-radius:14px;box-shadow:0 1px 0 var(--line),0 2px 10px rgba(14,59,44,.06);overflow:hidden}
.lb summary{list-style:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto 64px;gap:10px;align-items:center;padding:12px 14px;cursor:pointer;min-height:64px}
.lb summary::-webkit-details-marker{display:none}
.pos{font:700 30px/1 "Barlow Condensed",system-ui,sans-serif;color:var(--g);text-align:center}
.lb li:first-child .pos{color:#fff;background:var(--g);border-radius:10px;padding:6px 0}
.who b{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who small{color:var(--mut);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thru{font-size:13px;color:var(--mut);white-space:nowrap}
.pts{font:700 36px/1 "Barlow Condensed",system-ui,sans-serif;text-align:right}
.pts small{display:block;font:500 11px Inter;color:var(--mut)}
.segs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 14px 12px}
.seg{border-radius:10px;padding:8px;background:var(--g3);text-align:center}
.seg span{display:block;font-size:12px;color:var(--mut)}
.seg b{display:block;font:700 22px/1.1 "Barlow Condensed",system-ui,sans-serif}
.seg i{display:block;font-style:normal;font-size:12px;color:var(--mut)}
.scroll{overflow-x:auto}
table.sc{border-collapse:collapse;width:100%;font-size:14px;margin:0 0 12px}
.sc th,.sc td{padding:6px 4px;text-align:center;border-top:1px solid var(--line);white-space:nowrap}
.sc th:first-child,.sc td:first-child{text-align:left;padding-left:14px;color:var(--mut);font-weight:500}
.sc .tot{font-weight:700}
.dot0{box-shadow:inset 0 -3px 0 var(--f0)}.dot1{box-shadow:inset 0 -3px 0 var(--f1)}.dot2{box-shadow:inset 0 -3px 0 var(--f2)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:12px 2px 0}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
/* scoring */
.panel{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 0 var(--line);margin-bottom:12px}
label{font-size:13px;color:var(--mut);font-weight:500}
select,input{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:#fff;font-size:16px}
input.filled{background:#fff6c2;transition:background .3s}
input:focus,select:focus,button:focus-visible{outline:3px solid #9ad3b4;outline-offset:1px}
.btn{border:0;border-radius:12px;min-height:48px;padding:10px 16px;font-weight:700;background:var(--g);color:#fff;cursor:pointer}
.btn.ghost{background:var(--g3);color:var(--g)}
.btn.warn{background:#fde8ea;color:#a01826}
.btn.warn.armed{background:var(--red);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.row>*{flex:1 1 140px}
.hole{background:var(--card);border-radius:14px;margin-bottom:10px;box-shadow:0 1px 0 var(--line);border-left:6px solid var(--c);overflow:hidden}
.hh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 14px 4px}
.hh b{font:700 24px "Barlow Condensed",system-ui,sans-serif}
.hh span{font-size:13px;color:var(--mut)}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto 48px;gap:8px;align-items:center;padding:8px 14px 12px}
.ent+.ent{border-top:1px dashed var(--line);padding-top:10px}
.ent .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ent .nm small{display:block;white-space:normal;font-weight:400;color:var(--mut);font-size:12px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:48px;border-radius:12px;border:0;background:var(--g3);color:var(--g);font-size:26px;font-weight:600;cursor:pointer;touch-action:manipulation}
.step output{width:40px;text-align:center;font:700 30px/1 "Barlow Condensed",system-ui,sans-serif}
.pt{text-align:center;border-radius:10px;padding:4px 0;background:var(--g3)}
.pt b{display:block;font:700 24px/1 "Barlow Condensed",system-ui,sans-serif}
.pt small{font-size:11px;color:var(--mut)}
.pt.none{opacity:.45}
.segh{font:700 18px "Barlow Condensed",system-ui,sans-serif;letter-spacing:.3px;margin:18px 2px 8px;color:var(--c);display:flex;justify-content:space-between}
.segh span{font:500 13px Inter;color:var(--mut)}
/* setup */
.pair{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.pair .full{grid-column:1/-1;display:flex;gap:8px}
.pair .full input{flex:1}
.x{flex:none;width:46px;border:0;border-radius:10px;background:#fde8ea;color:#a01826;font-size:20px;cursor:pointer}
.course{border-collapse:collapse;width:100%}
.prow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) 72px 46px;gap:6px;padding:5px 0}
details.panel>summary{list-style:none}details.panel>summary::before{content:"▸ ";color:var(--g)}details[open].panel>summary::before{content:"▾ "}
.course td,.course th{padding:3px;text-align:center;font-size:13px;color:var(--mut)}
.course input{min-width:44px;padding:6px 2px;text-align:center}
h2.sec{font:700 22px "Barlow Condensed",system-ui,sans-serif;margin:0 0 8px}
.note{font-size:13px;color:var(--mut);margin:6px 0 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg width="34" height="34" viewBox="0 0 34 34" aria-hidden="true"><rect x="15" y="4" width="2.4" height="24" fill="#fff"/><path d="M17.4 4.5 28 8.5 17.4 12.6z" fill="#e63946"/><ellipse cx="17" cy="29" rx="11" ry="3" fill="#1f5c44"/></svg>
    <div><h1 id="title">Golf Scores</h1><p id="sub">Pairs 3-3-3 Stableford</p></div>
  </div>
  <span id="net" class="net">Connecting…</span>
</header>
<nav class="tabs" role="tablist">
  <button data-v="board" class="on">Leaderboard</button>
  <button data-v="score">Enter scores</button>
  <button data-v="setup">Setup</button>
</nav>
<main>
  <div id="banner"></div>
  <section id="v-board"></section>
  <section id="v-score" hidden></section>
  <section id="v-setup" hidden></section>
</main>
<div id="toast" role="status"></div>

<script type="module">
// ===== Paste the firebaseConfig from Firebase here (replace null) =====
const firebaseConfig = {
  apiKey: "AIzaSyAOCfd-NKd23WN2pGkvGzN1Ot-u5eAVbpI",
  authDomain: "golf-scores-sifah.firebaseapp.com",
  projectId: "golf-scores-sifah",
  storageBucket: "golf-scores-sifah.firebasestorage.app",
  messagingSenderId: "797319516606",
  appId: "1:797319516606:web:b47468896797870f4ce9ef"
};
// ======================================================================
{
const SDK='https://www.gstatic.com/firebasejs/10.12.2/';
const EMAIL='scorer@sifah.golf',ADMIN='admin@sifah.golf';
const isAdmin=()=>!!user&&user.email===ADMIN;
const DEF={title:'Pairs 3-3-3 Stableford',course:'Jebel Sifah · Front 9',par:[4,4,5,4,5,3,4,3,4],si:[13,1,5,15,9,11,3,17,7],pairs:[]};
const ROSTER=[["Abs", "Al Balushi", 28], ["Adrian", "Clifford", 28], ["Alan", "Hill", 26.2], ["Bradley", "Viljoen", 19], ["Chris", "MacDonald", 22], ["Elizabeth", "Shearer", 36], ["Emma", "Fenton", 36], ["Fiona", "Hanks", 36], ["Frans", "Kohler", 22], ["Freek", "van Dijk", 28], ["Gay", "Clifford", 36], ["Gerry", "Woods", 10], ["Heiderose", "Mossen", 31], ["Hudson", "Kemp", 14], ["Iain", "Watford", 23], ["Jaime", "Kemp", 36], ["James", "Thompson", 15], ["Jenna", "Viljoen", 36], ["Johnny", "Agapie", 28], ["Neil", "McLoughlin", 28], ["Ninien", "Blignault", 30], ["Petra", "Markt", 31.4], ["Saif", "Al Abdullatif", 28], ["Sheldon", "Kemp", 18], ["Stephen", "Martin", 28], ["Tim", "Fenton", 10], ["Vanessa", "Jackson", 21], ["Willie", "Fourie", 28], ["Yvonne", "Grant", 30], ["Jonathan", "Grant", 25], ["Ben", "Martin", 28], ["Mark", "Geilenkirchen", 28], ["Esther", "Grootenboer", 28], ["Erwen", "De La Cruz", 18], ["Fred", "van Nieuwenhuizen", 28], ["Brian", "Wilson", 26], ["Jenny", "Wilson", 36], ["Ed", "Price", 28], ["Jan-Willen", "van Lienden", 18.5], ["Kamil", "Weinhold", 28], ["Gina", "Sanda", 25], ["Cristian", "Sanda", 15], ["Chantal", "Vlaarkamp", 36], ["Chon", "Humtsoe", 22]];
const FMT=[{n:'Shamble',c:'var(--f0)',d:'75% each · both scores count'},{n:'Greensomes',c:'var(--f1)',d:'60% low + 40% high'},{n:'Scramble',c:'var(--f2)',d:'35% low + 15% high'}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let P=ROSTER.map(([n,l,h])=>({n,l,h})),R=structuredClone(DEF),S={},user=null,view='board',fs=null,au=null,db=null,auth=null,setupDirty=false;
const LOCAL=!firebaseConfig;

function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function net(state){const e=$('net');e.className='net '+(state==='live'?'live':state==='off'?'off':'');e.textContent=state==='live'?'Live':state==='off'?'Offline · will sync':state==='demo'?'Demo mode':'Connecting…'}

// ---------- scoring maths ----------
const fmtOf=h=>h<=3?0:h<=6?1:2;
function ranks(si){const o=si.map((v,i)=>[+v||99,i]).sort((a,b)=>a[0]-b[0]);const r=[];o.forEach(([,i],k)=>r[i]=k+1);return r}
function strokes(ph,r){if(ph>=0)return Math.floor(ph/9)+(r<=ph%9?1:0);const m=-ph;return -(Math.floor(m/9)+(r>9-m%9?1:0))}
function phs(p){const a=(+p.h1||0)/2,b=(+p.h2||0)/2,lo=Math.min(a,b),hi=Math.max(a,b);
  return{a:Math.round(.75*a),b:Math.round(.75*b),g:Math.round(.6*lo+.4*hi),s:Math.round(.35*lo+.15*hi)}}
const pn=(p,k)=>(k==='a'?p.p1:p.p2)||(k==='a'?'Player 1':'Player 2');
const teamName=p=>p.name||`${p.p1||'Player 1'} & ${p.p2||'Player 2'}`;
function card(p){
  const P=phs(p),rk=ranks(R.si),sc=S[p.id]||{};let tot=0,thru=0;const seg=[0,0,0],holes=[];
  for(let h=1;h<=9;h++){const i=h-1,par=+R.par[i]||4,f=fmtOf(h);
    const rows=f===0?[['a',pn(p,'a'),P.a],['b',pn(p,'b'),P.b]]:[['',f===1?'Greensomes ball':'Scramble ball',f===1?P.g:P.s]];
    let done=true,hp=0;
    const e=rows.map(([k,l,ph])=>{const key=h+k,g=sc[key],gross=(g===undefined||g===null)?null:+g,st=strokes(ph,rk[i]);
      const pt=gross===null?null:gross===0?0:Math.max(0,par+2-(gross-st));
      if(pt===null)done=false;else{tot+=pt;seg[f]+=pt;hp+=pt}return{key,label:l,ph,st,gross,pt}});
    if(done)thru++;holes.push({h,par,si:R.si[i],f,e,done,hp:e.some(x=>x.pt!==null)?hp:null})}
  return{P,tot,seg,thru,holes}}

// ---------- rendering ----------
function render(){
  $('title').textContent=R.title||'Golf Scores';$('sub').textContent=R.course||'';
  if(view==='board')renderBoard();else if(view==='score')renderScore();else if(!setupDirty)renderSetup();
}
function renderBoard(){
  const el=$('v-board');
  if(!R.pairs.length){el.innerHTML=`<div class="empty"><h2>No pairs yet</h2><p>Add the pairs in <b>Setup</b> to start the round.</p></div>`;return}
  const rows=R.pairs.map(p=>({p,c:card(p)})).sort((x,y)=>y.c.tot-x.c.tot||y.c.thru-x.c.thru);
  let last=null,rank=0;const open=new Set([...document.querySelectorAll('.lb details[open]')].map(d=>d.dataset.id));
  el.innerHTML=`<ol class="lb">${rows.map((r,i)=>{if(r.c.tot!==last){rank=i+1;last=r.c.tot}
    const {p,c}=r;
    return `<li><details data-id="${esc(p.id)}" ${open.has(p.id)?'open':''}><summary>
      <span class="pos">${rank}</span>
      <span class="who"><b>${esc(teamName(p))}</b><small>${esc(p.p1||'')} ${esc(p.h1??'')} · ${esc(p.p2||'')} ${esc(p.h2??'')}</small></span>
      <span class="thru">${c.thru===9?'Finished':c.thru?'Thru '+c.thru:'Not started'}</span>
      <span class="pts">${c.tot}<small>pts</small></span></summary>
      <div class="segs">${FMT.map((f,k)=>`<div class="seg" style="box-shadow:inset 0 3px 0 ${f.c}"><span>${f.n}</span><b>${c.seg[k]}</b><i>${k===0?`gets ${c.P.a} / ${c.P.b}`:`gets ${k===1?c.P.g:c.P.s}`}</i></div>`).join('')}</div>
      <div class="scroll"><table class="sc"><tr><th>Hole</th>${c.holes.map(h=>`<th class="dot${h.f}">${h.h}</th>`).join('')}<th>Tot</th></tr>
      <tr><td>Par</td>${c.holes.map(h=>`<td>${h.par}</td>`).join('')}<td>${c.holes.reduce((a,h)=>a+h.par,0)}</td></tr>
      <tr><td>Points</td>${c.holes.map(h=>`<td>${h.hp??'–'}</td>`).join('')}<td class="tot">${c.tot}</td></tr></table></div>
    </details></li>`}).join('')}</ol>
    <div class="legend">${FMT.map((f,k)=>`<span style="--c:${f.c}">Holes ${k*3+1}–${k*3+3} ${f.n}</span>`).join('')}</div>`;
}
function pinForm(msg,role='scorer'){const a=role==='admin';return `<div class="panel"><h2 class="sec">${a?'Organiser sign-in':'Scorer sign-in'}</h2><p class="note" style="margin:0 0 10px">${msg}</p>
  <form class="row pinf" data-role="${role}"><div><label for="pin-${role}">${a?'Admin password':'Round PIN'}</label><input id="pin-${role}" type="password" autocomplete="current-password" required></div><button class="btn" style="flex:0 0 auto">Unlock</button></form></div>`}
function renderScore(){
  const el=$('v-score');
  if(!user){el.innerHTML=pinForm('Enter the PIN to record scores. Anyone can view the leaderboard without it.');return}
  if(!R.pairs.length){el.innerHTML=`<div class="empty"><h2>No pairs yet</h2><p>Add the pairs in <b>Setup</b> first.</p></div>`;return}
  let mine=ls.get('gs-pair',null);if(!R.pairs.some(p=>p.id===mine))mine=R.pairs[0].id;
  const p=R.pairs.find(x=>x.id===mine),c=card(p);
  el.innerHTML=`<div class="panel"><label for="pairsel">Scoring for</label><select id="pairsel">${R.pairs.map(x=>`<option value="${esc(x.id)}" ${x.id===mine?'selected':''}>${esc(teamName(x))}</option>`).join('')}</select>
    <p class="note">Total <b>${c.tot} pts</b> · ${c.thru===9?'finished':'thru '+c.thru}. Tap + to start at par. Below 1 = pick-up (0 pts).</p></div>`+
  c.holes.map(h=>(h.h%3===1?`<div class="segh" style="--c:${FMT[h.f].c}">${FMT[h.f].n} · holes ${h.h}–${h.h+2}<span>${c.seg[h.f]} pts</span></div>`:'')+
   `<div class="hole" style="--c:${FMT[h.f].c}"><div class="hh"><b>Hole ${h.h}</b><span>Par ${h.par} · SI ${esc(h.si)}</span></div>${h.e.map(x=>`
    <div class="ent"><div class="nm">${esc(x.label)}<small>${x.st>0?`${x.st} shot${x.st>1?'s':''} here`:x.st<0?`gives ${-x.st} back`:'no shot'} · plays off ${x.ph}</small></div>
    <div class="step"><button data-k="${x.key}" data-d="-1" aria-label="Minus">−</button><output>${x.gross===null?'–':x.gross===0?'P/U':x.gross}</output><button data-k="${x.key}" data-d="1" aria-label="Plus">+</button></div>
    <div class="pt ${x.pt===null?'none':''}"><b>${x.pt??'–'}</b><small>pts</small></div></div>`).join('')}</div>`).join('');
}
function renderSetup(){
  const el=$('v-setup');
  if(!isAdmin()){el.innerHTML=pinForm('Setup is for organisers only: pairs, handicaps, players and clearing scores. The scorer PIN does not open it.','admin');return}
  setupDirty=false;
  el.innerHTML=`<div class="panel"><h2 class="sec">Round</h2><div class="row">
    <div><label for="t-title">Title</label><input id="t-title" value="${esc(R.title)}"></div>
    <div><label for="t-course">Course</label><input id="t-course" value="${esc(R.course)}"></div></div></div>
  <div class="panel"><h2 class="sec">Pairs</h2><p class="note" style="margin:0">Start typing a player's name and pick them from the list. Their handicap fills in automatically. Use normal 18-hole handicaps; the app halves them for 9 holes and applies each format's %. Plus handicaps: enter as negative (+2 → −2).</p>
    <datalist id="roster">${[...P].sort((a,b)=>a.n.localeCompare(b.n)).map(p=>`<option value="${esc(p.n)}">${esc(p.n+' '+p.l+' · '+p.h)}</option>`).join('')}</datalist>
    <div id="pairs">${R.pairs.map(pairRow).join('')}</div>
    <button class="btn ghost" id="addp" type="button" style="width:100%;margin-top:6px">+ Add pair</button></div>
  <details class="panel"><summary class="sec" style="cursor:pointer">Players &amp; handicaps (${P.length})</summary>
    <p class="note">Update a handicap here once and it fills in automatically from then on. Changes don't alter pairs already saved: re-pick the name to refresh.</p>
    <div id="players">${[...P].sort((a,b)=>a.n.localeCompare(b.n)).map(playerRow).join('')}</div>
    <div class="row" style="margin-top:8px"><button class="btn ghost" id="addpl" type="button">+ Add player</button><button class="btn" id="savep" type="button">Save players</button></div></details>
  <div class="panel"><h2 class="sec">Course card</h2><div class="scroll"><table class="course"><tr><th></th>${[...Array(9)].map((_,i)=>`<th>${i+1}</th>`).join('')}</tr>
    <tr><th>Par</th>${R.par.map((v,i)=>`<td><input inputmode="numeric" data-par="${i}" value="${esc(v)}" aria-label="Par hole ${i+1}"></td>`).join('')}</tr>
    <tr><th>SI</th>${R.si.map((v,i)=>`<td><input inputmode="numeric" data-si="${i}" value="${esc(v)}" aria-label="Stroke index hole ${i+1}"></td>`).join('')}</tr></table></div>
    <p class="note">Strokes go to the lowest SI first. Change these if you play the back 9.</p></div>
  <button class="btn" id="save" type="button" style="width:100%">Save setup</button>
  <div class="panel" style="margin-top:16px"><h2 class="sec">Other</h2><div class="row">
    <button class="btn warn" id="clear" type="button">Clear all scores</button>
    <button class="btn ghost" id="out" type="button">Lock (sign out)</button></div><p class="note">Signed in as organiser. You can also enter scores.</p><div></div></div>`;
}
const pairRow=p=>`<div class="pair" data-id="${esc(p.id)}">
  <div class="full"><input data-f="name" placeholder="Team name (optional)" value="${esc(p.name||'')}"><button class="x" type="button" data-rm aria-label="Remove pair">×</button></div>
  <input data-f="p1" list="roster" autocomplete="off" placeholder="Player 1" value="${esc(p.p1||'')}"><input data-f="h1" inputmode="decimal" placeholder="H'cap" value="${esc(p.h1??'')}">
  <input data-f="p2" list="roster" autocomplete="off" placeholder="Player 2" value="${esc(p.p2||'')}"><input data-f="h2" inputmode="decimal" placeholder="H'cap" value="${esc(p.h2??'')}"></div>`;
const newId=()=>Math.random().toString(36).slice(2,9);
const findP=v=>{v=String(v||'').trim().toLowerCase().replace(/\s+/g,' ');return v&&P.find(p=>p.n.toLowerCase()===v||(p.n+' '+p.l).toLowerCase()===v)};
const playerRow=p=>`<div class="prow"><input data-pn value="${esc(p.n||'')}" placeholder="First name" aria-label="First name"><input data-pl value="${esc(p.l||'')}" placeholder="Surname" aria-label="Surname"><input data-ph inputmode="decimal" value="${esc(p.h??'')}" placeholder="H'cap" aria-label="Handicap"><button class="x" type="button" data-prm aria-label="Remove player">×</button></div>`;
async function savePlayers(list){
  if(LOCAL){P=list;ls.set('gs-demo-P',P);return}
  await fs.setDoc(fs.doc(db,'rounds','roster'),{players:list});
}

// ---------- data writes ----------
async function saveRound(data){
  if(LOCAL){R=data;ls.set('gs-demo-R',R);render();return}
  await fs.setDoc(fs.doc(db,'rounds','current'),data);
}
const tm={},pend={};
function setScore(pid,key,val){
  (S[pid]??={})[key]=val;(pend[pid]??={})[key]=val;render();
  if(LOCAL){ls.set('gs-demo-S',S);return}
  clearTimeout(tm[pid]);tm[pid]=setTimeout(()=>{const d=pend[pid];delete pend[pid];
    fs.setDoc(fs.doc(db,'scores',pid),{s:d},{merge:true}).catch(e=>toast('Not saved: '+(e.code||e.message)))},300);
}

// ---------- events ----------
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  if(view==='setup'&&setupDirty&&b.dataset.v!=='setup'&&!confirmLeave())return;
  view=b.dataset.v;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  for(const v of['board','score','setup'])$('v-'+v).hidden=v!==view;setupDirty=false;render();scrollTo(0,0)});
let leaveArmed=0;function confirmLeave(){if(Date.now()-leaveArmed<3000)return true;leaveArmed=Date.now();toast('Unsaved setup changes — tap again to leave');return false}
document.addEventListener('submit',async e=>{const fm=e.target;if(!fm.classList.contains('pinf'))return;e.preventDefault();const pin=fm.querySelector('input').value,admin=fm.dataset.role==='admin';
  setupDirty=false;
  if(LOCAL){user={demo:1,email:admin?ADMIN:EMAIL};render();return}
  try{await au.signInWithEmailAndPassword(auth,admin?ADMIN:EMAIL,pin.trim());toast(admin?'Organiser unlocked':'Unlocked')}catch(err){const c=err&&err.code||'';
    toast(/invalid-credential|wrong-password|user-not-found|invalid-login/.test(c)?(admin?'Wrong admin password (':'Wrong PIN (')+c.replace('auth/','')+')':'Sign-in problem: '+(c||err.message))}});
$('v-score').addEventListener('change',e=>{if(e.target.id==='pairsel'){ls.set('gs-pair',e.target.value);render()}});
$('v-score').addEventListener('click',e=>{const b=e.target.closest('button[data-k]');if(!b)return;
  const pid=$('pairsel').value,k=b.dataset.k,h=parseInt(k),par=+R.par[h-1]||4,cur=S[pid]?.[k];let v;
  if(+b.dataset.d>0)v=cur==null?par:cur===0?1:Math.min(cur+1,15);else v=cur==null?null:cur===0?null:cur===1?0:cur-1;
  if(v!==(cur??null))setScore(pid,k,v)});
$('v-setup').addEventListener('input',e=>{const t=e.target;if(t.closest('.pinf'))return;setupDirty=true;
  const f=t.dataset.f;if(f==='p1'||f==='p2'){const m=findP(t.value);if(m){const h=t.closest('.pair').querySelector(`[data-f=h${f[1]}]`);h.value=m.h;h.classList.add('filled');setTimeout(()=>h.classList.remove('filled'),900)}}});
$('v-setup').addEventListener('change',e=>{const t=e.target,f=t.dataset.f;if(f==='p1'||f==='p2'){const m=findP(t.value);if(m)t.value=m.n}});
$('v-setup').addEventListener('click',async e=>{const t=e.target;
  if(t.id==='addp'){$('pairs').insertAdjacentHTML('beforeend',pairRow({id:newId()}));setupDirty=true}
  else if(t.matches('[data-rm]')){t.closest('.pair').remove();setupDirty=true}
  else if(t.id==='addpl'){$('players').insertAdjacentHTML('beforeend',playerRow({}));setupDirty=true}
  else if(t.matches('[data-prm]')){t.closest('.prow').remove();setupDirty=true}
  else if(t.id==='savep'){const list=[...document.querySelectorAll('.prow')].map(r=>({n:r.querySelector('[data-pn]').value.trim(),l:r.querySelector('[data-pl]').value.trim(),h:parseFloat(r.querySelector('[data-ph]').value.replace('+','-'))||0})).filter(p=>p.n);
    try{t.disabled=true;await savePlayers(list);P=list;toast('Players saved')}catch(err){toast('Not saved: '+(err.code||err.message))}finally{t.disabled=false}}
  else if(t.id==='save'){const pairs=[...document.querySelectorAll('.pair')].map(r=>{const o={id:r.dataset.id};
      r.querySelectorAll('[data-f]').forEach(i=>{const f=i.dataset.f,v=i.value.trim();o[f]=f[0]==='h'?(v===''?0:parseFloat(v.replace('+','-'))||0):v});return o});
    const par=[...document.querySelectorAll('[data-par]')].map(i=>parseInt(i.value)||4),si=[...document.querySelectorAll('[data-si]')].map(i=>parseInt(i.value)||0);
    try{t.disabled=true;await saveRound({title:$('t-title').value.trim(),course:$('t-course').value.trim(),par,si,pairs});setupDirty=false;toast('Setup saved')}
    catch(err){toast('Not saved: '+(err.code||err.message))}finally{t.disabled=false}}
  else if(t.id==='clear'){if(!t.classList.contains('armed')){t.classList.add('armed');t.textContent='Tap again to clear every score';setTimeout(()=>{t.classList.remove('armed');t.textContent='Clear all scores'},4000);return}
    t.classList.remove('armed');t.textContent='Clear all scores';
    if(LOCAL){S={};ls.set('gs-demo-S',S);render();toast('Scores cleared');return}
    try{await Promise.all(Object.keys(S).map(id=>fs.deleteDoc(fs.doc(db,'scores',id))));toast('Scores cleared')}catch(err){toast('Not cleared: '+(err.code||err.message))}}
  else if(t.id==='out'){if(LOCAL){user=null;render()}else{await au.signOut(auth)}}});

// ---------- start ----------
async function start(){
  if(LOCAL){
    $('banner').innerHTML=`<div class="banner"><b>Demo mode.</b> Not connected to Firebase yet. Anything entered stays on this phone only. Any PIN unlocks.</div>`;
    net('demo');R={...structuredClone(DEF),...ls.get('gs-demo-R',{})};S=ls.get('gs-demo-S',{});P=ls.get('gs-demo-P',P);render();return}
  try{
    const [appM,fsM,auM]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-firestore.js'),import(SDK+'firebase-auth.js')]);
    fs=fsM;au=auM;const app=appM.initializeApp(firebaseConfig);
    try{db=fs.initializeFirestore(app,{localCache:fs.persistentLocalCache({tabManager:fs.persistentMultipleTabManager()})})}catch{db=fs.getFirestore(app)}
    auth=au.getAuth(app);
    au.onAuthStateChanged(auth,u=>{user=u;render()});
    const slow=setTimeout(()=>net('off'),10000);
    fs.onSnapshot(fs.doc(db,'rounds','roster'),s=>{const d=s.exists()&&s.data().players;if(Array.isArray(d)&&d.length){P=d;render()}},()=>{});
    fs.onSnapshot(fs.doc(db,'rounds','current'),{includeMetadataChanges:true},s=>{
      if(s.exists())R={...structuredClone(DEF),...s.data()};
      if(!s.metadata.fromCache){clearTimeout(slow);net('live')}render()},e=>{net('off');toast('Cannot load round: '+e.code)});
    fs.onSnapshot(fs.collection(db,'scores'),{includeMetadataChanges:true},q=>{
      const n={};q.forEach(d=>{n[d.id]={...(d.data().s||{})}});
      for(const pid in pend)Object.assign(n[pid]??={},pend[pid]);S=n;
      net(q.metadata.fromCache&&!navigator.onLine?'off':'live');render()},e=>toast('Cannot load scores: '+e.code));
    addEventListener('offline',()=>net('off'));addEventListener('online',()=>net('live'));
  }catch(err){net('off');$('banner').innerHTML=`<div class="banner">Could not connect. Check the internet and reopen the app.</div>`}
}
render();start();
}
</script>
</body>
</html>
